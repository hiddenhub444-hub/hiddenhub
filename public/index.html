<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gemini</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500&display=swap');
        body { background-color: #131314; color: #e3e3e3; font-family: 'Google Sans', sans-serif; margin: 0; display: flex; height: 100vh; overflow: hidden; }
        
        /* Sidebar */
        .sidebar { width: 280px; background-color: #1e1f20; display: flex; flex-direction: column; padding: 12px; }
        .new-chat-btn { background-color: #1a1b1c; color: #8e918f; border-radius: 50px; padding: 10px 20px; font-size: 14px; display: flex; align-items: center; gap: 12px; margin-bottom: 30px; border: none; cursor: pointer; transition: 0.2s; width: fit-content; }
        .new-chat-btn:hover { background-color: #333537; color: #e3e3e3; }
        .history-item { padding: 10px 16px; border-radius: 50px; font-size: 14px; display: flex; align-items: center; gap: 12px; cursor: pointer; color: #c4c7c5; transition: 0.2s; }
        .history-item:hover { background-color: #333537; }
        .history-item.active { background-color: #004a77; color: #c2e7ff; }

        /* Main */
        .main-content { flex: 1; display: flex; flex-direction: column; }
        .chat-view { flex: 1; overflow-y: auto; padding-top: 40px; scroll-behavior: smooth; }
        .container { width: 100%; max-width: 800px; margin: 0 auto; padding: 0 20px; }

        /* Text Styles */
        .welcome-title { font-size: 56px; font-weight: 500; background: linear-gradient(74deg, #4285f4, #9b72cb, #d96570); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .user-msg { margin-bottom: 32px; display: flex; justify-content: flex-end; }
        .user-text { background-color: #28292a; padding: 12px 20px; border-radius: 22px; max-width: 85%; }
        .ai-msg { margin-bottom: 40px; display: flex; gap: 20px; }
        .ai-icon { width: 32px; height: 32px; background: linear-gradient(to bottom right, #4285f4, #d96570); border-radius: 50%; flex-shrink: 0; }
        
        /* Input */
        .bottom-area { padding: 20px; display: flex; flex-direction: column; align-items: center; }
        .input-bar { width: 100%; max-width: 800px; background-color: #1e1f20; border-radius: 32px; padding: 10px 24px; display: flex; align-items: center; gap: 15px; }
        textarea { flex: 1; background: transparent; border: none; outline: none; color: #e3e3e3; font-size: 16px; resize: none; max-height: 200px; line-height: 1.5; }

        .hidden { display: none !important; }
    </style>
</head>
<body>

    <aside class="sidebar">
        <button class="new-chat-btn" onclick="startNewChat()">
            <i class="fa-solid fa-plus"></i> <span>New chat</span>
        </button>
        <div class="text-xs font-medium text-gray-500 px-4 mb-4">Recent</div>
        <div id="sidebar-history" class="overflow-y-auto flex-grow space-y-1"></div>
    </aside>

    <main class="main-content">
        <div class="chat-view" id="chat-view">
            <div id="welcome-ui" class="container mt-20">
                <h1 class="welcome-title">Hello, User</h1>
                <p class="text-2xl text-gray-500 mt-2">How can I help you today?</p>
            </div>
            <div id="chat-log" class="container hidden"></div>
        </div>

        <div class="bottom-area">
            <div class="input-bar">
                <textarea id="user-input" rows="1" placeholder="Enter a prompt here" onkeydown="handleKeyPress(event)"></textarea>
                <i class="fa-solid fa-paper-plane text-blue-500 cursor-pointer text-xl" onclick="processMessage()"></i>
            </div>
            <p class="text-[11px] text-gray-500 mt-3">Gemini may display inaccurate info, so double-check its responses.</p>
        </div>
    </main>

    <script>
        const chatLog = document.getElementById('chat-log');
        const welcomeUI = document.getElementById('welcome-ui');
        const userInput = document.getElementById('user-input');
        const historyList = document.getElementById('sidebar-history');

        let currentChatId = null;
        let chatSessions = {}; // Stores { id: { title: "", msgs: [] } }

        // Banned Keywords for Safety Guard
        const BANNED = ["exploit", "hack", "leak", "inappropriate", "badword1", "badword2"];

        function handleKeyPress(e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                processMessage();
            }
        }

        function processMessage() {
            const text = userInput.value.trim();
            if (!text) return;

            // Safety Guard Check
            const isUnsafe = BANNED.some(word => text.toLowerCase().includes(word));

            if (!currentChatId) {
                currentChatId = Date.now();
                chatSessions[currentChatId] = { title: text, msgs: [] };
                addHistoryItem(currentChatId, text);
                welcomeUI.classList.add('hidden');
                chatLog.classList.remove('hidden');
                chatLog.innerHTML = '';
            }

            // User Message
            addMessageUI('user', text);
            chatSessions[currentChatId].msgs.push({ role: 'user', content: text });

            // AI Response
            setTimeout(() => {
                let responseText;
                if (isUnsafe) {
                    responseText = "I cannot help with that. I am designed to be a helpful and safe AI assistant, and I must follow safety guidelines regarding that type of request.";
                } else {
                    responseText = getAIResponse(text);
                }
                
                addMessageUI('ai', responseText);
                chatSessions[currentChatId].msgs.push({ role: 'ai', content: responseText });
            }, 800);

            userInput.value = '';
            userInput.style.height = 'auto';
        }

        function addMessageUI(role, content) {
            const div = document.createElement('div');
            div.className = role === 'user' ? 'user-msg' : 'ai-msg';
            
            if (role === 'user') {
                div.innerHTML = `<div class="user-text">${content}</div>`;
            } else {
                div.innerHTML = `<div class="ai-icon"></div><div class="ai-text">${content}</div>`;
            }
            
            chatLog.appendChild(div);
            document.getElementById('chat-view').scrollTop = document.getElementById('chat-view').scrollHeight;
        }

        function getAIResponse(input) {
            // General Conversational Logic
            const p = input.toLowerCase();
            if (p.includes("hello") || p.includes("hi")) return "Hello! How can I assist you today?";
            if (p.includes("who are you")) return "I am a Gemini-inspired AI assistant created to help you with information, writing, and general questions.";
            if (p.includes("weather")) return "I don't have real-time GPS access, but you can check your local weather app for the most accurate forecast!";
            return "That's an interesting question. I'm processing your request—could you provide more details so I can give you a better answer?";
        }

        function addHistoryItem(id, title) {
            const item = document.createElement('div');
            item.className = 'history-item';
            item.id = `chat-${id}`;
            item.innerHTML = `<i class="fa-regular fa-message"></i> <span class="truncate">${title}</span>`;
            item.onclick = () => switchChat(id);
            historyList.prepend(item);
        }

        function switchChat(id) {
            currentChatId = id;
            welcomeUI.classList.add('hidden');
            chatLog.classList.remove('hidden');
            chatLog.innerHTML = '';
            
            chatSessions[id].msgs.forEach(m => addMessageUI(m.role, m.content));
            
            document.querySelectorAll('.history-item').forEach(e => e.classList.remove('active'));
            document.getElementById(`chat-${id}`).classList.add('active');
        }

        function startNewChat() {
            currentChatId = null;
            welcomeUI.classList.remove('hidden');
            chatLog.classList.add('hidden');
            userInput.value = '';
            document.querySelectorAll('.history-item').forEach(e => e.classList.remove('active'));
        }
    </script>
</body>
</html>
