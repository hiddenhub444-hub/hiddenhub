<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Limited Ext Generator</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0d1117;
            color: #c9d1d9;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container {
            width: 100%;
            max-width: 900px;
            background: #161b22;
            padding: 30px;
            border-radius: 12px;
            border: 1px solid #30363d;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        h1 { color: #58a6ff; text-align: center; margin-bottom: 5px; }
        p.subtitle { text-align: center; color: #8b949e; margin-bottom: 25px; }
        
        textarea {
            width: 100%;
            background: #0d1117;
            color: #7ee787;
            border: 1px solid #30363d;
            border-radius: 8px;
            padding: 12px;
            font-family: 'Courier New', Courier, monospace;
            resize: vertical;
        }
        .input-area { height: 200px; margin-bottom: 20px; }
        
        .controls {
            text-align: center;
            margin-bottom: 30px;
        }
        button {
            background-color: #238636;
            color: white;
            border: none;
            padding: 15px 40px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            font-size: 18px;
            transition: transform 0.2s, background 0.2s;
        }
        button:hover { background-color: #2ea043; transform: scale(1.02); }
        button:active { transform: scale(0.98); }

        .outputs-grid {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 15px;
        }
        .output-card {
            display: flex;
            flex-direction: column;
        }
        .output-card label {
            margin-bottom: 8px;
            font-size: 14px;
            color: #58a6ff;
            font-weight: bold;
        }
        .output-area { height: 250px; font-size: 12px; }
    </style>
</head>
<body>

<div class="container">
    <h1>Limited Ext Generator</h1>
    <p class="subtitle">Paste your source code to generate 3 randomized variations</p>
    
    <textarea id="scriptInput" class="input-area" placeholder="Paste Roblox Script Source Here..."></textarea>
    
    <div class="controls">
        <button onclick="generateOutputs()">Confirm & Generate Trio</button>
    </div>

    <div class="outputs-grid">
        <div class="output-card">
            <label>Variation A</label>
            <textarea id="out1" class="output-area" readonly placeholder="Waiting..."></textarea>
        </div>
        <div class="output-card">
            <label>Variation B</label>
            <textarea id="out2" class="output-area" readonly placeholder="Waiting..."></textarea>
        </div>
        <div class="output-card">
            <label>Variation C</label>
            <textarea id="out3" class="output-area" readonly placeholder="Waiting..."></textarea>
        </div>
    </div>
</div>

<script>
    // Expanded list of random names
    const randomNames = [
        "Nebula-X", "CrimsonV2", "Hyperion", "FrostByte", "ShadowStep", 
        "Enigma", "ZenithHub", "Exodus", "Titanium", "Velocity", 
        "Obsidian", "Phantom", "Atlas", "Omega", "Viper"
    ];

    function getRandomColor() {
        const r = Math.floor(Math.random() * 255);
        const g = Math.floor(Math.random() * 255);
        const b = Math.floor(Math.random() * 255);
        return `Color3.fromRGB(${r}, ${g}, ${b})`;
    }

    function processCode(source) {
        let newCode = source;

        // Randomize Colors
        const colorRegex = /Color3\.(fromRGB|new)\(([^)]+)\)/g;
        newCode = newCode.replace(colorRegex, () => getRandomColor());

        // Randomize Titles/Names
        const nameRegex = /(\.Name|\.Text)\s*=\s*["']([^"']+)["']/g;
        newCode = newCode.replace(nameRegex, (match, property) => {
            const newName = randomNames[Math.floor(Math.random() * randomNames.length)];
            return `${property} = "${newName}"`;
        });

        return newCode;
    }

    function generateOutputs() {
        const source = document.getElementById('scriptInput').value;
        
        if (!source.trim()) {
            alert("The input is empty! Paste your script first.");
            return;
        }

        // Generate 3 unique versions
        document.getElementById('out1').value = processCode(source);
        document.getElementById('out2').value = processCode(source);
        document.getElementById('out3').value = processCode(source);
    }
</script>

</body>
</html>
