<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gemini</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500&display=swap');
        body { background-color: #131314; color: #e3e3e3; font-family: 'Google Sans', sans-serif; margin: 0; display: flex; height: 100vh; overflow: hidden; }
        
        /* Sidebar Navigation */
        .sidebar { width: 280px; background-color: #1e1f20; display: flex; flex-direction: column; padding: 12px; border-right: 1px solid #333537; z-index: 10; }
        .new-chat-btn { background-color: #1a1b1c; color: #8e918f; border-radius: 50px; padding: 12px 24px; font-size: 14px; display: flex; align-items: center; gap: 12px; margin-bottom: 30px; cursor: pointer; border: none; transition: 0.2s; width: fit-content; }
        .new-chat-btn:hover { background-color: #333537; color: #fff; }
        .history-item { padding: 10px 16px; border-radius: 50px; font-size: 14px; cursor: pointer; color: #c4c7c5; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: flex; align-items: center; gap: 10px; }
        .history-item:hover, .history-item.active { background-color: #333537; color: #fff; }

        /* Chat Content - FIXED WRAPPING */
        .main-content { flex: 1; display: flex; flex-direction: column; width: 100%; position: relative; }
        .chat-scroll { flex: 1; overflow-y: auto; scroll-behavior: smooth; }
        .container { width: 100%; max-width: 820px; margin: 0 auto; padding: 20px; }

        .welcome-text { font-size: 56px; font-weight: 500; background: linear-gradient(74deg, #4285f4, #9b72cb, #d96570); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        
        .msg-row { margin-bottom: 32px; width: 100%; display: flex; flex-direction: column; }
        .user-msg { align-self: flex-end; max-width: 85%; }
        .user-bubble { background-color: #28292a; padding: 14px 22px; border-radius: 24px; font-size: 16px; line-height: 1.6; word-wrap: break-word; white-space: pre-wrap; }
        
        .ai-msg { align-self: flex-start; display: flex; gap: 16px; width: 100%; }
        .ai-icon { width: 32px; height: 32px; background: linear-gradient(to bottom right, #4285f4, #9b72cb); border-radius: 50%; flex-shrink: 0; }
        .ai-text { flex: 1; font-size: 16px; line-height: 1.7; word-wrap: break-word; overflow-wrap: break-word; }

        /* Input Area */
        .input-container { padding: 20px; display: flex; flex-direction: column; align-items: center; }
        .input-bar { width: 100%; max-width: 820px; background-color: #1e1f20; border-radius: 32px; padding: 14px 24px; display: flex; align-items: center; gap: 15px; border: 2px solid transparent; }
        .input-bar.dragover { border-color: #4285f4; background-color: #282a2c; }
        textarea { flex: 1; background: transparent; border: none; outline: none; color: #e3e3e3; font-size: 16px; resize: none; max-height: 200px; }

        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-thumb { background: #333537; border-radius: 10px; }
        .hidden { display: none !important; }
    </style>
</head>
<body ondragover="event.preventDefault(); document.getElementById('input-bar').classList.add('dragover')" 
      ondragleave="document.getElementById('input-bar').classList.remove('dragover')" 
      ondrop="handleDrop(event)">

    <nav class="sidebar">
        <button class="new-chat-btn" onclick="startNewChat()">
            <i class="fa-solid fa-plus"></i> <span>New chat</span>
        </button>
        <div class="text-xs font-medium text-gray-500 px-4 mb-4 uppercase">Recent</div>
        <div id="sidebar-list" class="overflow-y-auto space-y-1"></div>
    </nav>

    <main class="main-content">
        <div class="chat-scroll" id="scroll-box">
            <div id="welcome-ui" class="container mt-20">
                <h1 class="welcome-text">Hello, User</h1>
                <p class="text-2xl text-gray-500 font-medium mt-2">I've got your history saved. Ask me anything.</p>
            </div>
            <div id="chat-log" class="container hidden pt-10"></div>
        </div>

        <div class="input-container">
            <div class="input-bar" id="input-bar">
                <textarea id="user-input" rows="1" placeholder="Enter a prompt here" onkeydown="handleEnter(event)"></textarea>
                <div class="flex gap-4 text-gray-400 text-xl items-center">
                    <label class="cursor-pointer hover:text-white"><i class="fa-regular fa-image"></i><input type="file" class="hidden" onchange="handleFile(event)"></label>
                    <i class="fa-solid fa-paper-plane text-blue-500 cursor-pointer" onclick="handleSend()"></i>
                </div>
            </div>
            <p class="text-[11px] text-gray-500 mt-3">Gemini may display inaccurate info. Progress is saved locally.</p>
        </div>
    </main>

    <script>
        const chatLog = document.getElementById('chat-log');
        const welcomeUI = document.getElementById('welcome-ui');
        const userInput = document.getElementById('user-input');
        const sidebarList = document.getElementById('sidebar-list');

        let currentChatId = null;
        let db = JSON.parse(localStorage.getItem('gemini_db')) || {};

        function handleEnter(e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                handleSend();
            }
            userInput.style.height = 'auto';
            userInput.style.height = userInput.scrollHeight + 'px';
        }

        function handleSend() {
            const val = userInput.value.trim();
            if (!val) return;

            if (!currentChatId) {
                currentChatId = Date.now();
                db[currentChatId] = { title: val, msgs: [] };
                welcomeUI.classList.add('hidden');
                chatLog.classList.remove('hidden');
                refreshSidebar();
            }

            addMessage('user', val);
            db[currentChatId].msgs.push({ role: 'user', text: val });

            // SMART RESPONSE
            setTimeout(() => {
                const response = getSmartResponse(val);
                addMessage('ai', response);
                db[currentChatId].msgs.push({ role: 'ai', text: response });
                localStorage.setItem('gemini_db', JSON.stringify(db));
            }, 500);

            userInput.value = '';
            userInput.style.height = 'auto';
        }

        function getSmartResponse(input) {
            const p = input.toLowerCase();
            
            // Fixed Refusal: Only triggers on actually dangerous intent
            if (p.includes("hack") && (p.includes("bank") || p.includes("account"))) {
                return "I cannot assist with requests involving unauthorized access to accounts or financial systems.";
            }

            if (p.includes("hello") || p.includes("hi")) return "Hello! How can I help you today?";
            if (p.includes("who are you")) return "I am a Gemini-style AI, designed to be helpful, clear, and concise.";
            if (p.includes("weather")) return "I don't have a GPS sensor, but you can check your local forecast on any weather site!";
            
            return "That's an interesting point. I'm processing your request—could you provide more context so I can be as helpful as possible?";
        }

        function addMessage(role, text) {
            const div = document.createElement('div');
            div.className = 'msg-row';
            div.innerHTML = role === 'user' 
                ? `<div class="user-msg"><div class="user-bubble">${text}</div></div>` 
                : `<div class="ai-msg"><div class="ai-icon"></div><div class="ai-text">${text}</div></div>`;
            chatLog.appendChild(div);
            document.getElementById('scroll-box').scrollTop = document.getElementById('scroll-box').scrollHeight;
        }

        function refreshSidebar() {
            sidebarList.innerHTML = '';
            Object.keys(db).reverse().forEach(id => {
                const item = document.createElement('div');
                item.className = `history-item ${id == currentChatId ? 'active' : ''}`;
                item.innerHTML = `<i class="fa-regular fa-message text-xs"></i> <span>${db[id].title}</span>`;
                item.onclick = () => {
                    currentChatId = id;
                    welcomeUI.classList.add('hidden');
                    chatLog.classList.remove('hidden');
                    chatLog.innerHTML = '';
                    db[id].msgs.forEach(m => addMessage(m.role, m.text));
                    refreshSidebar();
                };
                sidebarList.appendChild(item);
            });
        }

        function startNewChat() {
            currentChatId = null;
            welcomeUI.classList.remove('hidden');
            chatLog.classList.add('hidden');
            userInput.value = '';
            refreshSidebar();
        }

        function handleDrop(e) {
            e.preventDefault();
            document.getElementById('input-bar').classList.remove('dragover');
            const file = e.dataTransfer.files[0];
            if (file) userInput.value = `[File: ${file.name}] `;
        }

        function handleFile(e) {
            const file = e.target.files[0];
            if (file) userInput.value = `[File: ${file.name}] `;
        }

        refreshSidebar();
    </script>
</body>
</html>
