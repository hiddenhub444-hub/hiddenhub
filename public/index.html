<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Limited Ext Generator</title>
    <style>
        :root {
            --primary: #58a6ff;
            --bg: #0d1117;
            --card-bg: #161b22;
            --border: #30363d;
            --success: #238636;
        }

        body {
            font-family: 'Segoe UI', Tahoma, sans-serif;
            background-color: var(--bg);
            color: #c9d1d9;
            margin: 0;
            display: flex;
        }

        .sidebar {
            width: 260px;
            background: var(--card-bg);
            height: 100vh;
            padding: 25px;
            border-right: 1px solid var(--border);
            position: fixed;
            box-sizing: border-box;
        }

        .sidebar h3 { font-size: 11px; color: var(--primary); margin-top: 0; margin-bottom: 20px; text-transform: uppercase; letter-spacing: 2px; }

        .setting-group { margin-bottom: 22px; padding-bottom: 10px; border-bottom: 1px solid #21262d; }
        
        .sidebar label { font-weight: bold; font-size: 10px; display: block; margin-bottom: 8px; color: #8b949e; }

        .sidebar input[type="number"] {
            width: 100%;
            background: var(--bg);
            border: 1px solid var(--border);
            color: white;
            padding: 8px;
            border-radius: 5px;
        }

        /* Modern Toggle Switches */
        .switch-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        .switch {
            position: relative;
            display: inline-block;
            width: 36px;
            height: 20px;
        }

        .switch input { opacity: 0; width: 0; height: 0; }

        .slider {
            position: absolute;
            cursor: pointer;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: #30363d;
            transition: .4s;
            border-radius: 20px;
        }

        .slider:before {
            position: absolute;
            content: "";
            height: 14px; width: 14px;
            left: 3px; bottom: 3px;
            background-color: white;
            transition: .4s;
            border-radius: 50%;
        }

        input:checked + .slider { background-color: var(--success); }
        input:checked + .slider:before { transform: translateX(16px); }

        .main-content {
            margin-left: 260px;
            padding: 40px;
            width: 100%;
            box-sizing: border-box;
        }

        textarea {
            width: 100%;
            background: var(--bg);
            color: #7ee787;
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 15px;
            font-family: 'Courier New', monospace;
            margin-bottom: 20px;
        }

        .input-area { height: 300px; }

        .gen-btn {
            width: 100%;
            background-color: var(--success);
            color: white;
            border: none;
            padding: 18px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            font-size: 16px;
            margin-bottom: 40px;
        }

        .outputs-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 20px;
        }

        .output-card {
            background: var(--card-bg);
            padding: 20px;
            border-radius: 10px;
            border: 1px solid var(--border);
        }

        .output-area { height: 180px; font-size: 11px; color: #c9d1d9; background: #000; }

        .copy-btn {
            width: 100%;
            background: #21262d;
            color: #c9d1d9;
            border: 1px solid var(--border);
            padding: 10px;
            border-radius: 6px;
            cursor: pointer;
        }

        .copy-btn.success { background: var(--success); color: white; border-color: var(--success); }
    </style>
</head>
<body>

<div class="sidebar">
    <h3>CONTROL PANEL</h3>
    
    <div class="setting-group">
        <label>FILES TO GENERATE:</label>
        <input type="number" id="fileCount" value="3" min="1" max="30">
    </div>

    <div class="setting-group">
        <label>ANIMATION:</label>
        <div class="switch-container">
            <span style="font-size: 11px;">Intro UI</span>
            <label class="switch">
                <input type="checkbox" id="animToggle">
                <span class="slider"></span>
            </label>
        </div>
    </div>

    <div class="setting-group">
        <label>PRINTS:</label>
        <div class="switch-container">
            <span style="font-size: 11px;">Enabled</span>
            <label class="switch">
                <input type="checkbox" id="printToggle" checked>
                <span class="slider"></span>
            </label>
        </div>
        <label>PRINT AMOUNT:</label>
        <input type="number" id="printAmount" value="5" min="1" max="100">
    </div>

    <div class="setting-group">
        <label>FONT RANDOMISER:</label>
        <div class="switch-container">
            <span style="font-size: 11px;">Random Per Line</span>
            <label class="switch">
                <input type="checkbox" id="fontToggle">
                <span class="slider"></span>
            </label>
        </div>
    </div>
</div>

<div class="main-content">
    <div class="container">
        <h1 style="margin-top: 0;">Limited Ext Generator</h1>
        <textarea id="scriptInput" class="input-area" placeholder="Paste source code here..."></textarea>
        
        <button class="gen-btn" onclick="generateOutputs()">CONFIRM & GENERATE</button>

        <div id="outputsWrapper" class="outputs-grid"></div>
    </div>
</div>

<script>
    const randomNames = ["Vortex-X", "Nova Hub", "Shadow-Ware", "Aether V2", "Zenith", "Titanium", "Phantom", "Arctic Hub", "Elysium", "Void Script"];
    const robloxFonts = ["Enum.Font.GothamBold", "Enum.Font.GothamMedium", "Enum.Font.Arcade", "Enum.Font.Fantasy", "Enum.Font.SciFi", "Enum.Font.Code", "Enum.Font.Bangers", "Enum.Font.LuckiestGuy"];

    function processCode(source) {
        let lines = source.split('\n');
        const usePrint = document.getElementById('printToggle').checked;
        const printCount = document.getElementById('printAmount').value;
        const useFont = document.getElementById('fontToggle').checked;
        const useAnim = document.getElementById('animToggle').checked;

        let processedLines = lines.map(line => {
            let newLine = line;

            // 1. Color Randomizer
            newLine = newLine.replace(/Color3\.fromRGB\(\d+,\s*\d+,\s*\d+\)/g, () => {
                return `Color3.fromRGB(${Math.floor(Math.random()*255)}, ${Math.floor(Math.random()*255)}, ${Math.floor(Math.random()*255)})`;
            });

            // 2. ULTRA-STRICT Text Randomizer
            // Only renames if the line contains "Title" or "Name" AND does NOT contain "Button", "Btn", "Click", or "Toggle"
            const isButtonLine = /button|btn|click|toggle|mouse/i.test(newLine);
            const isTitleLine = /title|name|header/i.test(newLine);

            if (newLine.includes(".Text") && isTitleLine && !isButtonLine) {
                newLine = newLine.replace(/"([^"]+)"/, `"${randomNames[Math.floor(Math.random() * randomNames.length)]}"`);
            }

            // 3. Font Randomizer - Unique per line
            if (useFont && newLine.includes(".Font")) {
                newLine = newLine.replace(/Enum\.Font\.[a-zA-Z]+/g, () => {
                    return robloxFonts[Math.floor(Math.random() * robloxFonts.length)];
                });
            }

            return newLine;
        });

        let finalCode = processedLines.join('\n');

        // 4. Animation Snippet
        if (useAnim) {
            finalCode = `-- [ANIMATION LOADED]\ntask.spawn(function() print("UI Animation Started") end)\n` + finalCode;
        }

        // 5. Print Loop
        if (usePrint) {
            finalCode = `for i = 1, ${printCount} do print("LEAKED BY FPSL https://discord.gg/VuHrBW5q") end\n` + finalCode;
        }

        return finalCode;
    }

    function generateOutputs() {
        const source = document.getElementById('scriptInput').value;
        const count = document.getElementById('fileCount').value;
        const wrapper = document.getElementById('outputsWrapper');
        if (!source.trim()) return alert("Paste your code first!");

        wrapper.innerHTML = "";
        for (let i = 1; i <= count; i++) {
            const id = `out_${i}`;
            const card = document.createElement('div');
            card.className = 'output-card';
            card.innerHTML = `
                <label>VARIATION ${i}</label>
                <textarea id="${id}" class="output-area" readonly>${processCode(source)}</textarea>
                <button class="copy-btn" onclick="copyText('${id}', this)">Copy Code</button>
            `;
            wrapper.appendChild(card);
        }
    }

    function copyText(id, btn) {
        const area = document.getElementById(id);
        area.select();
        document.execCommand('copy');
        btn.innerText = "COPIED!";
        btn.classList.add('success');
        setTimeout(() => { btn.innerText = "Copy Code"; btn.classList.remove('success'); }, 1500);
    }
</script>

</body>
</html>
