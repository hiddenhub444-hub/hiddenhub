<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gemini Pro | Web-Connected AI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;700&display=swap');
        :root { --bg: #131314; --side: #1e1f20; --border: #333537; --blue: #4285f4; }
        body { background: var(--bg); color: #e3e3e3; font-family: 'Google Sans', sans-serif; margin: 0; display: flex; height: 100vh; overflow: hidden; }

        /* Sidebar */
        .sidebar { width: 280px; background: var(--side); display: flex; flex-direction: column; padding: 12px; border-right: 1px solid var(--border); transition: 0.3s; }
        .btn-new { background: #1a1b1c; color: #8e918f; border-radius: 50px; padding: 12px 20px; font-size: 14px; display: flex; align-items: center; gap: 12px; cursor: pointer; border: none; width: fit-content; margin-bottom: 24px; }
        .btn-new:hover { background: #333537; color: #fff; }
        .history-item { padding: 10px 16px; border-radius: 50px; font-size: 14px; cursor: pointer; color: #c4c7c5; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: flex; align-items: center; gap: 10px; }
        .history-item.active { background: #004a77; color: #c2e7ff; }

        /* Chat Area */
        .main { flex: 1; display: flex; flex-direction: column; position: relative; }
        .chat-scroll { flex: 1; overflow-y: auto; padding: 0 20px; scroll-behavior: smooth; }
        .inner { width: 100%; max-width: 820px; margin: 0 auto; }

        /* Welcome Text */
        .welcome-box { margin-top: 100px; }
        .grad-txt { font-size: 56px; font-weight: 500; background: linear-gradient(74deg, #4285f4, #9b72cb, #d96570); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }

        /* Bubbles */
        .msg-row { margin-bottom: 32px; display: flex; flex-direction: column; width: 100%; animation: fadeIn 0.3s ease; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
        .user-align { align-self: flex-end; max-width: 85%; }
        .user-bubble { background: #2e2f31; padding: 14px 24px; border-radius: 24px; line-height: 1.6; word-wrap: break-word; white-space: pre-wrap; }
        .ai-align { align-self: flex-start; display: flex; gap: 16px; width: 100%; }
        .ai-icon { width: 34px; height: 34px; background: linear-gradient(135deg, #4285f4, #d96570); border-radius: 50%; flex-shrink: 0; display: flex; align-items: center; justify-content: center; font-size: 14px; }
        .ai-txt { flex: 1; line-height: 1.8; word-wrap: break-word; }

        /* Search Badge */
        .search-badge { display: inline-flex; align-items: center; gap: 6px; background: #282a2c; border: 1px solid #444; padding: 4px 12px; border-radius: 50px; font-size: 12px; color: var(--blue); margin-bottom: 10px; }

        /* Input */
        .input-area { padding: 20px; display: flex; flex-direction: column; align-items: center; }
        .input-wrap { width: 100%; max-width: 820px; background: #1e1f20; border-radius: 32px; padding: 14px 24px; display: flex; align-items: flex-end; gap: 15px; border: 2px solid transparent; }
        .input-wrap:focus-within { background: #282a2c; border-color: #444; }
        textarea { flex: 1; background: transparent; border: none; outline: none; color: #fff; font-size: 16px; resize: none; max-height: 200px; padding: 5px 0; }
        .send-btn { color: var(--blue); cursor: pointer; font-size: 20px; transition: 0.2s; margin-bottom: 5px; }
        .send-btn:hover { transform: scale(1.1); }

        .hidden { display: none !important; }
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-thumb { background: #333537; border-radius: 10px; }
    </style>
</head>
<body>

    <aside class="sidebar">
        <button class="btn-new" onclick="newChat()"><i class="fa-solid fa-plus"></i> New chat</button>
        <div class="text-[11px] font-bold text-gray-500 px-4 mb-4 uppercase">Recent</div>
        <div id="history-list" class="history-list space-y-1"></div>
    </aside>

    <main class="main">
        <div class="chat-scroll" id="scroll-box">
            <div id="welcome" class="inner welcome-box">
                <h1 class="grad-txt">Hello, User</h1>
                <p class="text-5xl text-[#444746] font-medium">I'm connected to the web. Ask me anything.</p>
            </div>
            <div id="log" class="inner hidden pt-12"></div>
        </div>

        <div class="input-area">
            <div class="input-wrap">
                <textarea id="prompt" rows="1" placeholder="Search Google or type a prompt..." oninput="this.style.height='auto';this.style.height=this.scrollHeight+'px'" onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();send();}"></textarea>
                <i class="fa-solid fa-paper-plane send-btn" onclick="send()"></i>
            </div>
            <p class="text-[11px] text-gray-500 mt-3">Gemini searches the web to provide real-time accuracy.</p>
        </div>
    </main>

    <script>
        const log = document.getElementById('log');
        const welcome = document.getElementById('welcome');
        const prompt = document.getElementById('prompt');
        const historyList = document.getElementById('history-list');
        const scrollBox = document.getElementById('scroll-box');

        let currentId = null;
        let db = JSON.parse(localStorage.getItem('gemini_web_db')) || {};

        function newChat() {
            currentId = null;
            log.innerHTML = '';
            log.classList.add('hidden');
            welcome.classList.remove('hidden');
            prompt.value = '';
            renderSidebar();
        }

        async function send() {
            const text = prompt.value.trim();
            if (!text) return;

            if (!currentId) {
                currentId = "ch_" + Date.now();
                db[currentId] = { title: text.slice(0, 30), msgs: [] };
                welcome.classList.add('hidden');
                log.classList.remove('hidden');
            }

            addMsg('user', text);
            db[currentId].msgs.push({ role: 'user', text });
            prompt.value = '';
            prompt.style.height = 'auto';

            // Start "Web Search" simulation
            const typingId = showSearching();
            
            // Simulating a "Fetch" from Google/Websites
            const webResult = await simulateWebSearch(text);
            
            removeSearching(typingId);
            addMsg('ai', webResult, true);
            db[currentId].msgs.push({ role: 'ai', text: webResult, searched: true });
            
            save();
            renderSidebar();
        }

        async function simulateWebSearch(query) {
            return new Promise((resolve) => {
                setTimeout(() => {
                    const q = query.toLowerCase();
                    
                    // Safety logic
                    if (q.includes("hack") || q.includes("leak")) {
                        resolve("I cannot fulfill this request. My safety guidelines prevent me from searching for or generating content related to unauthorized access or hacks.");
                        return;
                    }

                    // Intent Analysis & Sentence Formation
                    if (q.includes("hi") || q.includes("hello")) {
                        resolve("Hello! I've checked my connection and I'm ready to help you explore the web or write some code. What's on your mind?");
                    } else if (q.includes("weather")) {
                        resolve("According to recent web data, the weather depends on your location, but globally, major cities are seeing seasonal shifts. Would you like me to look up a specific city?");
                    } else if (q.includes("time")) {
                        resolve(`The current system time is ${new Date().toLocaleTimeString()}. If you need a specific time zone, let me know!`);
                    } else {
                        resolve(`I've searched the web for "${query}". Based on the top results from various sources, it appears to be related to ${q.split(' ')[0]}. I've synthesized this information into a concise summary for you. Do you need more specific details from a certain website?`);
                    }
                }, 1500);
            });
        }

        function addMsg(role, text, searched = false) {
            const row = document.createElement('div');
            row.className = 'msg-row';
            if (role === 'user') {
                row.innerHTML = `<div class="user-align"><div class="user-bubble">${text}</div></div>`;
            } else {
                let badge = searched ? `<div class="search-badge"><i class="fa-solid fa-globe"></i> Searched Google</div>` : '';
                row.innerHTML = `
                    <div class="ai-align">
                        <div class="ai-icon"><i class="fa-solid fa-sparkles text-white"></i></div>
                        <div class="ai-txt">${badge}<div>${text}</div></div>
                    </div>`;
            }
            log.appendChild(row);
            scrollBox.scrollTop = scrollBox.scrollHeight;
        }

        function showSearching() {
            const id = "search_" + Date.now();
            const row = document.createElement('div');
            row.className = 'msg-row';
            row.id = id;
            row.innerHTML = `
                <div class="ai-align">
                    <div class="ai-icon"><i class="fa-solid fa-magnifying-glass text-white text-[10px]"></i></div>
                    <div class="ai-txt text-gray-500 italic text-sm">Searching Google and websites...</div>
                </div>`;
            log.appendChild(row);
            scrollBox.scrollTop = scrollBox.scrollHeight;
            return id;
        }

        function removeSearching(id) { document.getElementById(id)?.remove(); }

        function renderSidebar() {
            historyList.innerHTML = '';
            Object.keys(db).reverse().forEach(id => {
                const item = document.createElement('div');
                item.className = `history-item ${id === currentId ? 'active' : ''}`;
                item.innerHTML = `<i class="fa-regular fa-message"></i> ${db[id].title}`;
                item.onclick = () => loadChat(id);
                historyList.appendChild(item);
            });
        }

        function loadChat(id) {
            currentId = id;
            welcome.classList.add('hidden');
            log.classList.remove('hidden');
            log.innerHTML = '';
            db[id].msgs.forEach(m => addMsg(m.role, m.text, m.searched));
            renderSidebar();
        }

        function save() { localStorage.setItem('gemini_web_db', JSON.stringify(db)); }
        renderSidebar();
    </script>
</body>
</html>
