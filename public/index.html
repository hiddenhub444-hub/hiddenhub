<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Limited Ext Generator</title>
    <style>
        :root {
            --primary: #58a6ff;
            --bg: #0d1117;
            --card-bg: #161b22;
            --border: #30363d;
            --success: #238636;
        }

        body {
            font-family: 'Segoe UI', Tahoma, sans-serif;
            background-color: var(--bg);
            color: #c9d1d9;
            margin: 0;
            display: flex;
        }

        /* Sidebar Styling */
        .sidebar {
            width: 220px;
            background: var(--card-bg);
            height: 100vh;
            padding: 25px;
            border-right: 1px solid var(--border);
            position: fixed;
            box-sizing: border-box;
        }

        .sidebar h3 { font-size: 14px; color: var(--primary); margin-top: 0; margin-bottom: 20px; }

        .setting-group { margin-bottom: 25px; }
        
        .sidebar label { 
            font-weight: bold; 
            font-size: 11px; 
            display: block; 
            margin-bottom: 8px; 
            color: #8b949e;
        }

        .sidebar input[type="number"] {
            width: 100%;
            background: var(--bg);
            border: 1px solid var(--border);
            color: white;
            padding: 8px;
            border-radius: 5px;
        }

        /* Toggle Switch Styling */
        .switch-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .switch {
            position: relative;
            display: inline-block;
            width: 40px;
            height: 20px;
        }

        .switch input { opacity: 0; width: 0; height: 0; }

        .slider {
            position: absolute;
            cursor: pointer;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: #30363d;
            transition: .4s;
            border-radius: 20px;
        }

        .slider:before {
            position: absolute;
            content: "";
            height: 14px; width: 14px;
            left: 3px; bottom: 3px;
            background-color: white;
            transition: .4s;
            border-radius: 50%;
        }

        input:checked + .slider { background-color: var(--success); }
        input:checked + .slider:before { transform: translateX(20px); }

        /* Main Content */
        .main-content {
            margin-left: 220px;
            padding: 40px;
            width: 100%;
            box-sizing: border-box;
        }

        .container { max-width: 1000px; margin: 0 auto; }

        textarea {
            width: 100%;
            background: var(--bg);
            color: #7ee787;
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 15px;
            font-family: 'Courier New', monospace;
            box-sizing: border-box;
        }

        .input-area { height: 250px; margin-bottom: 20px; font-size: 13px; }

        .gen-btn {
            width: 100%;
            background-color: var(--success);
            color: white;
            border: none;
            padding: 18px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            font-size: 16px;
            margin-bottom: 40px;
        }

        .outputs-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
        }

        .output-card {
            background: var(--card-bg);
            padding: 20px;
            border-radius: 10px;
            border: 1px solid var(--border);
        }

        .output-area { height: 200px; font-size: 11px; margin-bottom: 15px; }

        .copy-btn {
            width: 100%;
            background: #21262d;
            color: #c9d1d9;
            border: 1px solid var(--border);
            padding: 10px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
        }

        .copy-btn.success { background: var(--success); color: white; border-color: var(--success); }

    </style>
</head>
<body>

<div class="sidebar">
    <h3>GENERATOR</h3>
    
    <div class="setting-group">
        <label>FILES (Max 30):</label>
        <input type="number" id="fileCount" value="3" min="3" max="30">
    </div>

    <div class="setting-group">
        <label>ANIMATION:</label>
        <div class="switch-container">
            <span style="font-size: 12px;">Intro Script</span>
            <label class="switch">
                <input type="checkbox" id="animToggle">
                <span class="slider"></span>
            </label>
        </div>
    </div>

    <div class="setting-group">
        <label>ICE HUB THEME:</label>
        <div class="switch-container">
            <span style="font-size: 12px;">Blue/White</span>
            <label class="switch">
                <input type="checkbox" id="iceHubToggle">
                <span class="slider"></span>
            </label>
        </div>
    </div>
</div>

<div class="main-content">
    <div class="container">
        <h1 style="margin-top: 0;">Limited Ext Generator</h1>
        <textarea id="scriptInput" class="input-area" placeholder="Paste your script source here... (Works with any Roblox GUI script)"></textarea>
        
        <button class="gen-btn" onclick="generateOutputs()">Confirm & Generate Variations</button>

        <div id="outputsWrapper" class="outputs-grid"></div>
    </div>
</div>

<script>
    const randomNames = ["Vortex-X", "Nova-Hub", "ShadowWare", "AetherV3", "Krypton", "Zenith", "Omega-Lvl", "Crimson-R"];

    const animCode = `task.spawn(function()
    local TS = game:GetService('TweenService')
    local SG = Instance.new('ScreenGui', game:GetService('Players').LocalPlayer:WaitForChild('PlayerGui'))
    SG.Name = 'FPSL_Leak'
    local bg = Instance.new('Frame', SG)
    bg.Size = UDim2.new(1, 0, 1, 0)
    bg.BackgroundColor3 = Color3.new(0, 0, 0)
    bg.BackgroundTransparency = 1
    local t1 = Instance.new('TextLabel', bg)
    t1.Size = UDim2.new(1, 0, 0.4, 0)
    t1.Position = UDim2.new(0, 0, 0.3, 0)
    t1.BackgroundTransparency = 1
    t1.Text = 'Leaked by fpsl'
    t1.TextColor3 = Color3.new(1, 1, 1)
    t1.TextScaled = true
    t1.TextTransparency = 1
    local btn = Instance.new('TextButton', bg)
    btn.Size = UDim2.new(0.18, 0, 0.09, 0)
    btn.Position = UDim2.new(0.41, 0, 0.78, 0)
    btn.Text = 'Skip'
    btn.Visible = false
    TS:Create(bg, TweenInfo.new(0.8), {BackgroundTransparency = 0}):Play()
    task.wait(0.4)
    TS:Create(t1, TweenInfo.new(0.8), {TextTransparency = 0}):Play()
    task.wait(1.5)
    btn.Visible = true
    btn.MouseButton1Click:Connect(function() 
        if setclipboard then setclipboard('discord.gg/freesources') end
        SG:Destroy() 
    end)
end)\n\n`;

    const iceHubLogic = `\n-- Ice Hub Theme
task.spawn(function()
    local function apply(gui)
        for _, v in ipairs(gui:GetDescendants()) do
            if v:IsA("UIGradient") then
                v.Color = ColorSequence.new({ColorSequenceKeypoint.new(0, Color3.fromRGB(0, 160, 255)), ColorSequenceKeypoint.new(1, Color3.fromRGB(255, 255, 255))})
                task.spawn(function() while v.Parent do v.Rotation = v.Rotation + 2 task.wait(0.05) end end)
            elseif v:IsA("TextButton") or v:IsA("TextLabel") and v.Name == "Title" then
                v.BackgroundColor3 = Color3.fromRGB(0, 85, 255)
            end
        end
    end
    apply(script.Parent)
end)\n`;

    function processCode(source) {
        let code = source;
        const isIce = document.getElementById('iceHubToggle').checked;
        const isAnim = document.getElementById('animToggle').checked;

        // Targeted Regex for Titles (finds strings assigned to Name or Text that look like titles)
        // Matches: .Text = "Text", .Name = "Text", ["Text"] = "Text"
        const titleRegex = /(\.Text|\.Name|TextLabel\.Text|\["Text"\])\s*=\s*["']([^"']+)["']/g;
        code = code.replace(titleRegex, (match, prop, val) => {
            // Only replace if the value looks like a title (Capitalized or Hub-related)
            if (val.length > 2 && isNaN(val)) {
                const newName = isIce ? "Ice Hub" : randomNames[Math.floor(Math.random() * randomNames.length)];
                return `${prop} = "${newName}"`;
            }
            return match;
        });

        // Color Randomization (If Ice Hub is OFF)
        if (!isIce) {
            code = code.replace(/Color3\.fromRGB\(\s*\d+\s*,\s*\d+\s*,\s*\d+\s*\)/g, () => {
                return `Color3.fromRGB(${Math.floor(Math.random()*255)}, ${Math.floor(Math.random()*255)}, ${Math.floor(Math.random()*255)})`;
            });
            code = code.replace(/Color3\.new\(\s*[0-9.]+\s*,\s*[0-9.]+\s*,\s*[0-9.]+\s*\)/g, () => {
                return `Color3.new(${Math.random().toFixed(2)}, ${Math.random().toFixed(2)}, ${Math.random().toFixed(2)})`;
            });
        } else {
            code += iceHubLogic;
        }

        if (isAnim) code = animCode + code;
        return code;
    }

    function generateOutputs() {
        const source = document.getElementById('scriptInput').value;
        const count = document.getElementById('fileCount').value;
        const wrapper = document.getElementById('outputsWrapper');
        if (!source.trim()) return alert("Please paste your script!");
        
        wrapper.innerHTML = "";
        for (let i = 1; i <= count; i++) {
            const id = `out_${i}`;
            const card = document.createElement('div');
            card.className = 'output-card';
            card.innerHTML = `
                <label>VARIATION ${i}</label>
                <textarea id="${id}" class="output-area" readonly>${processCode(source)}</textarea>
                <button class="copy-btn" onclick="copyText('${id}', this)">Copy Code</button>
            `;
            wrapper.appendChild(card);
        }
    }

    function copyText(id, btn) {
        const area = document.getElementById(id);
        area.select();
        document.execCommand('copy');
        const oldText = btn.innerText;
        btn.innerText = "COPIED!";
        btn.classList.add('success');
        setTimeout(() => { 
            btn.innerText = oldText; 
            btn.classList.remove('success'); 
        }, 1500);
    }
</script>

</body>
</html>
