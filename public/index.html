<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gemini 2.0 | Advanced Engine</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;700&display=swap');
        
        :root {
            --gemini-bg: #131314;
            --gemini-sidebar: #1e1f20;
            --gemini-gray: #c4c7c5;
            --gemini-blue: #4285f4;
            --gemini-border: #333537;
        }

        * { box-sizing: border-box; }
        body { 
            background-color: var(--gemini-bg); 
            color: #e3e3e3; 
            font-family: 'Google Sans', sans-serif; 
            margin: 0; 
            display: flex; 
            height: 100vh; 
            overflow: hidden; 
        }

        /* --- SIDEBAR --- */
        .sidebar { 
            width: 280px; 
            background-color: var(--gemini-sidebar); 
            display: flex; 
            flex-direction: column; 
            padding: 12px; 
            border-right: 1px solid var(--gemini-border);
            z-index: 100;
        }

        .new-chat-wrapper { margin-bottom: 24px; }
        
        .btn-new-chat {
            background-color: #1a1b1c;
            color: var(--gemini-gray);
            border-radius: 50px;
            padding: 12px 20px;
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 12px;
            cursor: pointer;
            border: none;
            transition: all 0.2s ease;
            width: fit-content;
        }

        .btn-new-chat:hover {
            background-color: #333537;
            color: #fff;
        }

        .recent-title {
            font-size: 11px;
            font-weight: 700;
            color: #8e918f;
            padding: 0 16px;
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .history-list { flex: 1; overflow-y: auto; }

        .history-item {
            padding: 10px 16px;
            border-radius: 50px;
            font-size: 14px;
            cursor: pointer;
            color: #c4c7c5;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            display: flex;
            align-items: center;
            gap: 12px;
            transition: 0.2s;
        }

        .history-item:hover, .history-item.active {
            background-color: #333537;
            color: #fff;
        }

        /* --- MAIN CONTENT --- */
        .main-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            position: relative;
            background-color: var(--gemini-bg);
        }

        .chat-view {
            flex: 1;
            overflow-y: auto;
            scroll-behavior: smooth;
            padding: 0 20px;
        }

        .inner-wrap {
            width: 100%;
            max-width: 820px;
            margin: 0 auto;
        }

        /* Welcome UI */
        .welcome-screen { margin-top: 100px; text-align: left; }
        
        .gemini-gradient {
            font-size: 56px;
            font-weight: 500;
            background: linear-gradient(74deg, #4285f4, #9b72cb, #d96570);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            display: block;
        }

        .sub-welcome {
            font-size: 56px;
            font-weight: 500;
            color: #444746;
            margin-top: -10px;
        }

        /* --- MESSAGES (FIXED WRAPPING) --- */
        .message-block {
            margin-bottom: 36px;
            display: flex;
            flex-direction: column;
            width: 100%;
            animation: slideIn 0.3s ease-out;
        }

        @keyframes slideIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .user-msg-align { align-self: flex-end; max-width: 85%; }
        
        .user-bubble {
            background-color: #2e2f31;
            padding: 14px 24px;
            border-radius: 26px;
            font-size: 16px;
            line-height: 1.6;
            word-wrap: break-word; /* FIXED: Sentences behind the line */
            overflow-wrap: break-word;
            white-space: pre-wrap;
        }

        .ai-msg-align { align-self: flex-start; display: flex; gap: 18px; width: 100%; }

        .ai-avatar {
            width: 34px;
            height: 34px;
            background: linear-gradient(135deg, #4285f4, #d96570);
            border-radius: 50%;
            flex-shrink: 0;
            margin-top: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .ai-content {
            flex: 1;
            font-size: 16px;
            line-height: 1.8;
            color: #e3e3e3;
            word-wrap: break-word;
            overflow-wrap: break-word;
        }

        /* Typing Effect */
        .typing-dot {
            display: inline-block;
            width: 6px; height: 6px;
            background: #fff;
            border-radius: 50%;
            margin-right: 3px;
            animation: blink 1.4s infinite both;
        }
        .typing-dot:nth-child(2) { animation-delay: 0.2s; }
        .typing-dot:nth-child(3) { animation-delay: 0.4s; }

        @keyframes blink {
            0%, 80%, 100% { opacity: 0; }
            40% { opacity: 1; }
        }

        /* --- INPUT AREA --- */
        .footer-area {
            padding: 20px;
            background: var(--gemini-bg);
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .input-pill {
            width: 100%;
            max-width: 820px;
            background-color: #1e1f20;
            border-radius: 32px;
            padding: 14px 24px;
            display: flex;
            align-items: flex-end;
            gap: 16px;
            border: 2px solid transparent;
            transition: border 0.3s;
        }

        .input-pill:focus-within { border-color: #444; background-color: #282a2c; }
        .input-pill.drag-hover { border-color: var(--gemini-blue); background-color: #282a2c; }

        textarea {
            flex: 1;
            background: transparent;
            border: none;
            outline: none;
            color: #e3e3e3;
            font-size: 16px;
            resize: none;
            max-height: 200px;
            padding: 6px 0;
            font-family: inherit;
        }

        .action-icons { display: flex; gap: 18px; align-items: center; margin-bottom: 6px; }
        .icon-btn { color: #c4c7c5; cursor: pointer; font-size: 20px; transition: 0.2s; }
        .icon-btn:hover { color: #fff; }

        .disclaimer { font-size: 11px; color: #8e918f; margin-top: 12px; }

        .hidden { display: none !important; }
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-thumb { background: #333537; border-radius: 10px; }
    </style>
</head>
<body ondragover="handleDragOver(event)" ondragleave="handleDragLeave(event)" ondrop="handleDrop(event)">

    <aside class="sidebar">
        <div class="new-chat-wrapper">
            <button class="btn-new-chat" onclick="startFreshChat()">
                <i class="fa-solid fa-plus"></i> <span>New chat</span>
            </button>
        </div>

        <div class="recent-title">Recent</div>
        <div id="chat-history-container" class="history-list">
            </div>

        <div class="mt-auto pt-4 border-t border-[#333537]">
            <div class="history-item" onclick="clearLocalMemory()" style="color: #d96570;">
                <i class="fa-solid fa-trash"></i> <span>Clear All Memory</span>
            </div>
        </div>
    </aside>

    <main class="main-container">
        <div class="chat-view" id="scroll-box">
            
            <div id="welcome-ui" class="inner-wrap welcome-screen">
                <span class="gemini-gradient">Hello, Gemini User</span>
                <span class="sub-welcome">How can I help you today?</span>
                
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mt-12">
                    <div class="p-6 bg-[#1e1f20] rounded-2xl border border-transparent hover:border-[#444] cursor-pointer" onclick="quickAction('Explain quantum physics briefly')">
                        <p class="text-sm">Explain quantum physics briefly...</p>
                    </div>
                    <div class="p-6 bg-[#1e1f20] rounded-2xl border border-transparent hover:border-[#444] cursor-pointer" onclick="quickAction('Write a Python script for data sorting')">
                        <p class="text-sm">Write a Python script...</p>
                    </div>
                </div>
            </div>

            <div id="chat-messages" class="inner-wrap hidden pt-12"></div>
        </div>

        <div class="footer-area">
            <div class="input-pill" id="drop-pill">
                <textarea id="prompt-input" rows="1" placeholder="Enter a prompt here" oninput="autoGrow(this)" onkeydown="checkEnter(event)"></textarea>
                
                <div class="action-icons">
                    <label class="icon-btn"><i class="fa-regular fa-image"></i><input type="file" class="hidden" onchange="fileSelected(event)"></label>
                    <i class="fa-solid fa-paper-plane text-blue-500 icon-btn" onclick="executeSend()"></i>
                </div>
            </div>
            <p class="disclaimer">Gemini may display inaccurate info. Memory is saved to LocalStorage.</p>
        </div>
    </main>

    <script>
        /* =========================================
           CORE LOGIC ENGINE
           ========================================= */

        const messagesBox = document.getElementById('chat-messages');
        const welcomeUI = document.getElementById('welcome-ui');
        const promptInput = document.getElementById('prompt-input');
        const historyList = document.getElementById('chat-history-container');
        const scrollBox = document.getElementById('scroll-box');
        const dropPill = document.getElementById('drop-pill');

        let currentSessionId = null;
        let memory = JSON.parse(localStorage.getItem('gemini_v4_data')) || {};

        // 1. CHAT NAVIGATION & TABS
        function startFreshChat() {
            currentSessionId = null;
            // ACTUAL FIX: Wipe the message container for NEW chat
            messagesBox.innerHTML = '';
            messagesBox.classList.add('hidden');
            welcomeUI.classList.remove('hidden');
            promptInput.value = '';
            promptInput.style.height = 'auto';
            updateSidebarUI();
        }

        function loadChatSession(id) {
            currentSessionId = id;
            welcomeUI.classList.add('hidden');
            messagesBox.classList.remove('hidden');
            messagesBox.innerHTML = ''; // Clear current screen
            
            // Re-render only messages from THIS session
            memory[id].history.forEach(m => {
                renderMessageUI(m.role, m.text);
            });
            updateSidebarUI();
        }

        // 2. DATA PROCESSING
        function executeSend() {
            const val = promptInput.value.trim();
            if (!val) return;

            // First message in a new chat? Create session
            if (!currentSessionId) {
                currentSessionId = "session_" + Date.now();
                memory[currentSessionId] = {
                    title: val.substring(0, 30),
                    history: []
                };
                welcomeUI.classList.add('hidden');
                messagesBox.classList.remove('hidden');
            }

            // User Message
            renderMessageUI('user', val);
            memory[currentSessionId].history.push({ role: 'user', text: val });

            // AI Smart Logic
            promptInput.value = '';
            promptInput.style.height = 'auto';
            
            // Show Typing State
            const typingId = showTyping();

            setTimeout(() => {
                const response = brainLogic(val);
                removeTyping(typingId);
                renderMessageUI('ai', response);
                memory[currentSessionId].history.push({ role: 'ai', text: response });
                
                // Save to Storage
                localStorage.setItem('gemini_v4_data', JSON.stringify(memory));
                updateSidebarUI();
            }, 800);
        }

        // 3. BRAIN LOGIC (Context Aware + Intent)
        function brainLogic(userInput) {
            const input = userInput.toLowerCase();

            // Safety Refusal check (As requested)
            const badWords = ["hack", "exploit", "leak", "cheat", "bypass", "unauthorized"];
            if (badWords.some(w => input.includes(w))) {
                return "I cannot fulfill this request. I am designed to be a helpful and safe AI assistant, and my safety guidelines prevent me from generating content related to hacks, exploits, or unauthorized access.";
            }

            // Smart Responses (Not Dumb)
            if (input === "hi" || input === "hello" || input === "hey") {
                return "Hello! I'm Gemini. I've been watching your session—how can I help you build or write something today?";
            }

            if (input.includes("who are you")) {
                return "I am a custom-coded Gemini AI interface. I use a logic engine to process your commands and remember our conversation history.";
            }

            if (input.includes("code") || input.includes("script")) {
                return "I can definitely help with code. Are you working on a website, a Roblox script, or something else? Give me the details!";
            }

            // Default fallback
            return "I've noted that. I'm keeping our conversation in mind—could you tell me a bit more so I can give you a better answer?";
        }

        // 4. UI BUILDERS
        function renderMessageUI(role, text) {
            const wrapper = document.createElement('div');
            wrapper.className = 'message-block';
            
            if (role === 'user') {
                wrapper.innerHTML = `
                    <div class="user-msg-align">
                        <div class="user-bubble">${escape(text)}</div>
                    </div>`;
            } else {
                wrapper.innerHTML = `
                    <div class="ai-msg-align">
                        <div class="ai-avatar"><i class="fa-solid fa-sparkles text-white text-xs"></i></div>
                        <div class="ai-content">${text}</div>
                    </div>`;
            }

            messagesBox.appendChild(wrapper);
            scrollBox.scrollTop = scrollBox.scrollHeight;
        }

        function showTyping() {
            const id = "type_" + Date.now();
            const wrapper = document.createElement('div');
            wrapper.className = 'message-block';
            wrapper.id = id;
            wrapper.innerHTML = `
                <div class="ai-msg-align">
                    <div class="ai-avatar"><i class="fa-solid fa-sparkles text-white text-xs"></i></div>
                    <div class="ai-content">
                        <span class="typing-dot"></span>
                        <span class="typing-dot"></span>
                        <span class="typing-dot"></span>
                    </div>
                </div>`;
            messagesBox.appendChild(wrapper);
            scrollBox.scrollTop = scrollBox.scrollHeight;
            return id;
        }

        function removeTyping(id) {
            const el = document.getElementById(id);
            if (el) el.remove();
        }

        function updateSidebarUI() {
            historyList.innerHTML = '';
            // Show sessions in reverse order
            Object.keys(memory).reverse().forEach(id => {
                const div = document.createElement('div');
                div.className = `history-item ${id === currentSessionId ? 'active' : ''}`;
                div.innerHTML = `<i class="fa-regular fa-message"></i> <span>${memory[id].title}</span>`;
                div.onclick = () => loadChatSession(id);
                historyList.appendChild(div);
            });
        }

        // 5. UTILITIES
        function autoGrow(element) {
            element.style.height = "auto";
            element.style.height = (element.scrollHeight) + "px";
        }

        function checkEnter(e) {
            if (e.key === "Enter" && !e.shiftKey) {
                e.preventDefault();
                executeSend();
            }
        }

        function escape(html) {
            return html.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        }

        function clearLocalMemory() {
            if(confirm("Delete all history?")) {
                localStorage.removeItem('gemini_v4_data');
                memory = {};
                startFreshChat();
            }
        }

        function quickAction(txt) {
            promptInput.value = txt;
            executeSend();
        }

        // 6. DRAG & DROP
        function handleDragOver(e) { e.preventDefault(); dropPill.classList.add('drag-hover'); }
        function handleDragLeave(e) { dropPill.classList.remove('drag-hover'); }
        function handleDrop(e) {
            e.preventDefault();
            dropPill.classList.remove('drag-hover');
            const file = e.dataTransfer.files[0];
            if (file) {
                promptInput.value += `[File: ${file.name}] `;
                promptInput.focus();
            }
        }

        function fileSelected(e) {
            const file = e.target.files[0];
            if (file) promptInput.value += `[File: ${file.name}] `;
        }

        // Initialize
        updateSidebarUI();
    </script>
</body>
</html>
