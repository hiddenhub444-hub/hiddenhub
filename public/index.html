<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GitHub Script Randomizer Bot</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0d1117;
            color: #c9d1d9;
            display: flex;
            justify-content: center;
            padding: 20px;
        }
        .container {
            width: 100%;
            max-width: 800px;
            background: #161b22;
            padding: 30px;
            border-radius: 10px;
            border: 1px solid #30363d;
        }
        h2 { color: #58a6ff; text-align: center; }
        textarea {
            width: 100%;
            height: 300px;
            background: #0d1117;
            color: #7ee787;
            border: 1px solid #30363d;
            border-radius: 5px;
            padding: 10px;
            font-family: 'Courier New', Courier, monospace;
            resize: vertical;
        }
        .controls {
            margin-top: 20px;
            text-align: center;
        }
        button {
            background-color: #238636;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            font-size: 16px;
        }
        button:hover { background-color: #2ea043; }
        .output-label { margin-top: 20px; display: block; color: #8b949e; }
    </style>
</head>
<body>

<div class="container">
    <h2>GitHub Script Transformer</h2>
    <p>Paste your Lua/Roblox script source below:</p>
    
    <textarea id="scriptInput" placeholder="Paste script here..."></textarea>
    
    <div class="controls">
        <button onclick="transformScript()">Confirm & Randomize</button>
    </div>

    <label class="output-label">Modified Result:</label>
    <textarea id="scriptOutput" placeholder="Your new script will appear here..." readonly></textarea>
</div>

<script>
    // List of random names for the GUI Title
    const randomNames = ["VortexHub", "ShadowWare", "Aether", "NovaScript", "Zenith", "Krypton", "Solaris", "LunaExecutor"];

    function getRandomColor() {
        // Generates random RGB values for Color3.fromRGB
        const r = Math.floor(Math.random() * 255);
        const g = Math.floor(Math.random() * 255);
        const b = Math.floor(Math.random() * 255);
        return `Color3.fromRGB(${r}, ${g}, ${b})`;
    }

    function transformScript() {
        let code = document.getElementById('scriptInput').value;
        
        if (!code.trim()) {
            alert("Please paste a script first!");
            return;
        }

        // 1. Randomize Color3 values 
        // Matches: Color3.fromRGB(anything) or Color3.new(anything)
        const colorRegex = /Color3\.(fromRGB|new)\(([^)]+)\)/g;
        code = code.replace(colorRegex, () => getRandomColor());

        // 2. Randomize Titles
        // Matches common patterns like: .Name = "Text" or .Text = "Text"
        const nameRegex = /(\.Name|\.Text)\s*=\s*["']([^"']+)["']/g;
        code = code.replace(nameRegex, (match, property) => {
            const newName = randomNames[Math.floor(Math.random() * randomNames.length)];
            return `${property} = "${newName}"`;
        });

        document.getElementById('scriptOutput').value = code;
        alert("Script Randomized! Check the output box.");
    }
</script>

</body>
</html>
