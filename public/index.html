<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gemini</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500&display=swap');
        
        body { background-color: #131314; color: #e3e3e3; font-family: 'Google Sans', sans-serif; margin: 0; display: flex; height: 100vh; overflow: hidden; }
        
        /* Sidebar Navigation */
        .sidebar { width: 280px; background-color: #1e1f20; display: flex; flex-direction: column; padding: 12px; border-right: 1px solid #333537; z-index: 10; }
        .new-chat-btn { background-color: #1a1b1c; color: #8e918f; border-radius: 50px; padding: 12px 24px; font-size: 14px; display: flex; align-items: center; gap: 12px; margin-bottom: 30px; cursor: pointer; border: none; transition: 0.2s; }
        .new-chat-btn:hover { background-color: #333537; color: #fff; }
        
        .history-item { padding: 10px 16px; border-radius: 50px; font-size: 14px; cursor: pointer; color: #c4c7c5; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: flex; align-items: center; gap: 10px; }
        .history-item:hover, .history-item.active { background-color: #333537; color: #fff; }

        /* Chat Layout - FIXED TEXT WRAPPING */
        .main-content { flex: 1; display: flex; flex-direction: column; width: 100%; position: relative; }
        .chat-scroll { flex: 1; overflow-y: auto; scroll-behavior: smooth; }
        .container { width: 100%; max-width: 820px; margin: 0 auto; padding: 20px; }

        .welcome-text { font-size: 56px; font-weight: 500; background: linear-gradient(74deg, #4285f4, #9b72cb, #d96570); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }

        .msg-row { margin-bottom: 32px; width: 100%; display: flex; flex-direction: column; }
        .user-msg { align-self: flex-end; max-width: 85%; }
        .user-bubble { background-color: #28292a; padding: 14px 20px; border-radius: 24px; font-size: 16px; line-height: 1.6; word-wrap: break-word; overflow-wrap: break-word; white-space: pre-wrap; }
        
        .ai-msg { align-self: flex-start; display: flex; gap: 16px; width: 100%; }
        .ai-icon { width: 32px; height: 32px; background: linear-gradient(to bottom right, #4285f4, #d96570); border-radius: 50%; flex-shrink: 0; }
        .ai-text { flex: 1; font-size: 16px; line-height: 1.7; word-wrap: break-word; overflow-wrap: break-word; }

        /* Input Area - DRAG & DROP SUPPORT */
        .input-container { padding: 20px; display: flex; flex-direction: column; align-items: center; }
        .input-bar { width: 100%; max-width: 820px; background-color: #1e1f20; border-radius: 32px; padding: 12px 24px; display: flex; align-items: center; gap: 15px; border: 2px solid transparent; transition: 0.3s; }
        .input-bar.dragover { border-color: #4285f4; background-color: #282a2c; }
        textarea { flex: 1; background: transparent; border: none; outline: none; color: #e3e3e3; font-size: 16px; resize: none; max-height: 200px; }

        .hidden { display: none !important; }
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-thumb { background: #333537; border-radius: 10px; }
    </style>
</head>
<body ondragover="event.preventDefault(); document.getElementById('input-bar').classList.add('dragover')" 
      ondragleave="document.getElementById('input-bar').classList.remove('dragover')" 
      ondrop="handleDrop(event)">

    <nav class="sidebar">
        <button class="new-chat-btn" onclick="startNew()">
            <i class="fa-solid fa-plus"></i> <span>New chat</span>
        </button>
        <div class="text-xs font-medium text-gray-500 px-4 mb-4 uppercase tracking-tighter">Recent</div>
        <div id="history-list" class="overflow-y-auto space-y-1"></div>
    </nav>

    <main class="main-content">
        <div class="chat-scroll" id="scroll-box">
            <div id="welcome" class="container mt-20">
                <h1 class="welcome-text">Hello, User</h1>
                <p class="text-2xl text-gray-500 font-medium mt-2">I remember our past chats. How can I help?</p>
            </div>
            <div id="chat-log" class="container hidden pt-10"></div>
        </div>

        <div class="input-container">
            <div class="input-bar" id="input-bar">
                <textarea id="user-input" rows="1" placeholder="Enter a prompt here" onkeydown="handleKey(event)"></textarea>
                <div class="flex gap-4 text-gray-400 text-xl items-center">
                    <label class="cursor-pointer hover:text-white"><i class="fa-regular fa-image"></i><input type="file" class="hidden" onchange="handleFile(event)"></label>
                    <i class="fa-solid fa-paper-plane text-blue-500 cursor-pointer" onclick="sendMsg()"></i>
                </div>
            </div>
            <p class="text-[11px] text-gray-500 mt-3">Gemini may display inaccurate info. Memory is saved locally.</p>
        </div>
    </main>

    <script>
        const chatLog = document.getElementById('chat-log');
        const welcome = document.getElementById('welcome');
        const input = document.getElementById('user-input');
        const historyUI = document.getElementById('history-list');

        let currentId = null;
        // Load Memory from LocalStorage
        let chatMemory = JSON.parse(localStorage.getItem('gemini_history')) || {};

        function saveToDisk() {
            localStorage.setItem('gemini_history', JSON.stringify(chatMemory));
        }

        function handleKey(e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMsg();
            }
            input.style.height = 'auto';
            input.style.height = input.scrollHeight + 'px';
        }

        function sendMsg() {
            const val = input.value.trim();
            if (!val) return;

            if (!currentId) {
                currentId = Date.now();
                chatMemory[currentId] = { title: val, messages: [] };
                welcome.classList.add('hidden');
                chatLog.classList.remove('hidden');
                renderHistory();
            }

            // User Message
            addUI('user', val);
            chatMemory[currentId].messages.push({ role: 'user', content: val });

            // AI "Smart" Brain Logic
            setTimeout(() => {
                let response = generateResponse(val);
                addUI('ai', response);
                chatMemory[currentId].messages.push({ role: 'ai', content: response });
                saveToDisk();
            }, 600);

            input.value = '';
            input.style.height = 'auto';
        }

        function generateResponse(text) {
            const p = text.toLowerCase();
            // Refusal Logic
            if (p.includes("exploit") || p.includes("hack") || p.includes("leak") || p.includes("cheat")) {
                return "I cannot help with that. I am designed to be a helpful and safe AI assistant, and I must decline requests involving restricted or harmful content.";
            }
            
            // Contextual Logic
            if (p.includes("hello")) return "Hi there! I remember you. How can I assist you today?";
            if (p.includes("who made you")) return "I am a Gemini-inspired AI built to assist you with a wide range of tasks.";
            if (p.includes("code") || p.includes("script")) return "I can help explain code logic or write boilerplate for you. What language are we using?";
            
            return "I've noted that. Based on our conversation, I'm ready to help you further—what's the next step?";
        }

        function addUI(role, text) {
            const row = document.createElement('div');
            row.className = 'msg-row';
            if (role === 'user') {
                row.innerHTML = `<div class="user-msg"><div class="user-bubble">${text}</div></div>`;
            } else {
                row.innerHTML = `<div class="ai-msg"><div class="ai-icon"></div><div class="ai-text">${text}</div></div>`;
            }
            chatLog.appendChild(row);
            document.getElementById('scroll-box').scrollTop = document.getElementById('scroll-box').scrollHeight;
        }

        function renderHistory() {
            historyUI.innerHTML = '';
            Object.keys(chatMemory).reverse().forEach(id => {
                const item = document.createElement('div');
                item.className = `history-item ${id == currentId ? 'active' : ''}`;
                item.innerHTML = `<i class="fa-regular fa-message text-xs"></i> <span>${chatMemory[id].title}</span>`;
                item.onclick = () => loadChat(id);
                historyUI.appendChild(item);
            });
        }

        function loadChat(id) {
            currentId = id;
            welcome.classList.add('hidden');
            chatLog.classList.remove('hidden');
            chatLog.innerHTML = '';
            chatMemory[id].messages.forEach(m => addUI(m.role, m.content));
            renderHistory();
        }

        function startNew() {
            currentId = null;
            welcome.classList.remove('hidden');
            chatLog.classList.add('hidden');
            input.value = '';
            renderHistory();
        }

        // File Drag/Drop
        function handleDrop(e) {
            e.preventDefault();
            document.getElementById('input-bar').classList.remove('dragover');
            const file = e.dataTransfer.files[0];
            if (file) input.value = `[File uploaded: ${file.name}] `;
        }

        function handleFile(e) {
            const file = e.target.files[0];
            if (file) input.value = `[File selected: ${file.name}] `;
        }

        // Initial Load
        renderHistory();
    </script>
</body>
</html>
