<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Limited Ext Generator - Ice Hub Edition</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, sans-serif;
            background-color: #0d1117;
            color: #c9d1d9;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        /* Sidebar Menu */
        .sidebar {
            position: fixed;
            top: 20px;
            left: 20px;
            background: #161b22;
            padding: 20px;
            border-radius: 10px;
            border: 1px solid #30363d;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            z-index: 100;
            width: 180px;
        }
        .sidebar label { 
            font-weight: bold; 
            font-size: 11px; 
            display: block; 
            margin-bottom: 8px; 
            color: #58a6ff;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .sidebar input[type="number"] {
            width: 100%;
            background: #0d1117;
            border: 1px solid #30363d;
            color: white;
            padding: 8px;
            border-radius: 5px;
            margin-bottom: 20px;
            box-sizing: border-box;
        }
        .toggle-row { 
            display: flex; 
            justify-content: space-between;
            align-items: center; 
            margin-bottom: 20px;
            font-size: 13px;
        }
        
        /* Main UI */
        .container {
            width: 100%;
            max-width: 1100px;
            background: #161b22;
            padding: 30px;
            border-radius: 12px;
            border: 1px solid #30363d;
        }
        h1 { color: #58a6ff; text-align: center; margin-top: 0; }
        .input-area { 
            height: 200px; 
            width: 100%;
            background: #0d1117;
            color: #7ee787;
            border: 1px solid #30363d;
            border-radius: 8px;
            padding: 12px;
            font-family: 'Courier New', monospace;
            margin-bottom: 20px;
        }
        .gen-btn {
            display: block;
            width: 100%;
            background-color: #238636;
            color: white;
            border: none;
            padding: 15px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            font-size: 18px;
            margin-bottom: 30px;
        }
        .gen-btn:hover { background-color: #2ea043; }

        .outputs-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 20px;
        }
        .output-card {
            background: #0d1117;
            padding: 15px;
            border-radius: 8px;
            border: 1px solid #30363d;
        }
        .output-area { height: 150px; font-size: 11px; width: 100%; margin-bottom: 10px; }
        .copy-btn {
            width: 100%;
            background: #30363d;
            color: white;
            border: 1px solid #8b949e;
            padding: 8px;
            border-radius: 6px;
            cursor: pointer;
        }
        .copy-btn.success { background: #238636; border-color: #238636; }
    </style>
</head>
<body>

<div class="sidebar">
    <label>FILES:</label>
    <input type="number" id="fileCount" value="3" min="3" max="30">
    
    <label>ANIMATION:</label>
    <div class="toggle-row">
        <span>OFF</span>
        <input type="checkbox" id="animToggle">
        <span>ON</span>
    </div>

    <label>ICE HUB MODE:</label>
    <div class="toggle-row">
        <span>OFF</span>
        <input type="checkbox" id="iceHubToggle">
        <span>ON</span>
    </div>
</div>

<div class="container">
    <h1>Limited Ext Generator</h1>
    <textarea id="scriptInput" class="input-area" placeholder="Paste Roblox Script Source Here..."></textarea>
    <button class="gen-btn" onclick="generateOutputs()">Confirm & Generate</button>
    <div id="outputsWrapper" class="outputs-grid"></div>
</div>

<script>
    const randomNames = ["Vortex", "Shadow", "Nebula", "Aether", "Frost", "Zenith", "Titan", "Phantom"];

    // The Animation Script
    const animCode = `task.spawn(function()
    local TS = game:GetService('TweenService')
    local UIS = game:GetService('UserInputService')
    local SG = Instance.new('ScreenGui', game:GetService('Players').LocalPlayer:WaitForChild('PlayerGui'))
    SG.Name = 'FPSL_Leak'
    SG.IgnoreGuiInset = true
    SG.DisplayOrder = 999999

    local bg = Instance.new('Frame', SG)
    bg.Size = UDim2.new(1, 0, 1, 0)
    bg.BackgroundColor3 = Color3.new(0, 0, 0)
    bg.BackgroundTransparency = 1

    local t1 = Instance.new('TextLabel', bg)
    t1.Size = UDim2.new(1, 0, 0.4, 0)
    t1.Position = UDim2.new(0, 0, 0.3, 0)
    t1.BackgroundTransparency = 1
    t1.Text = 'Leaked by fpsl'
    t1.TextColor3 = Color3.new(1, 1, 1)
    t1.TextScaled = true
    t1.Font = Enum.Font.GothamBold
    t1.TextTransparency = 1

    local t2 = Instance.new('TextLabel', bg)
    t2.Size = UDim2.new(1, 0, 0.4, 0)
    t2.Position = UDim2.new(0, 0, 0.3, 0)
    t2.BackgroundTransparency = 1
    t2.Text = 'discord.gg/freesources'
    t2.TextColor3 = Color3.new(1, 1, 1)
    t2.TextScaled = true
    t2.Font = Enum.Font.GothamBold
    t2.TextTransparency = 1

    local btn = Instance.new('TextButton', bg)
    btn.Size = UDim2.new(0.18, 0, 0.09, 0)
    btn.Position = UDim2.new(0.41, 0, 0.78, 0)
    btn.BackgroundColor3 = Color3.fromRGB(25, 25, 25)
    btn.Text = 'Skip'
    btn.TextColor3 = Color3.new(1, 1, 1)
    btn.TextScaled = true
    btn.Visible = false
    btn.BackgroundTransparency = 1
    Instance.new('UICorner', btn).CornerRadius = UDim.new(0, 12)

    local info = TweenInfo.new(0.8)
    TS:Create(bg, info, {BackgroundTransparency = 0}):Play()
    task.wait(0.4)
    TS:Create(t1, info, {TextTransparency = 0}):Play()
    task.wait(1.5)
    TS:Create(t1, info, {TextTransparency = 1}):Play()
    task.wait(0.6)
    TS:Create(t2, info, {TextTransparency = 0}):Play()
    btn.Visible = true
    TS:Create(btn, info, {BackgroundTransparency = 0, TextTransparency = 0}):Play()

    btn.MouseButton1Click:Connect(function()
        if setclipboard then setclipboard('discord.gg/freesources') end
        btn.Text = 'join for more.'
        task.wait(1.5)
        SG:Destroy()
    end)
end)\n\n`;

    // The Ice Hub Blue Theme Logic
    const iceHubLogic = `\n-- Ice Hub Theme Applied
task.spawn(function()
    local function apply(gui)
        for _, v in ipairs(gui:GetDescendants()) do
            if v:IsA("UIGradient") then
                v.Color = ColorSequence.new({
                    ColorSequenceKeypoint.new(0, Color3.fromRGB(0, 160, 255)),
                    ColorSequenceKeypoint.new(1, Color3.fromRGB(255, 255, 255))
                })
                -- Rotating Gradient Logic
                task.spawn(function()
                    while v and v.Parent do
                        v.Rotation = v.Rotation + 1
                        task.wait(0.03)
                    end
                end)
            elseif v:IsA("TextButton") then
                v.BackgroundColor3 = Color3.fromRGB(0, 70, 200)
                v.TextColor3 = Color3.new(1, 1, 1)
            end
        end
    end
    apply(script.Parent)
end)\n`;

    function processCode(source) {
        let code = source;
        const isIce = document.getElementById('iceHubToggle').checked;
        const isAnim = document.getElementById('animToggle').checked;

        // 1. Title Replacement (Matches .Text = "Something" if it looks like a title)
        code = code.replace(/(\.Title|\.HeaderText|TextLabel\.Text)\s*=\s*["']([^"']+)["']/g, (m, prop) => {
            const name = isIce ? "Ice Hub" : randomNames[Math.floor(Math.random() * randomNames.length)];
            return `${prop} = "${name}"`;
        });

        // 2. Color Logic
        if (isIce) {
            code += iceHubLogic;
        } else {
            code = code.replace(/Color3\.(fromRGB|new)\(([^)]+)\)/g, () => {
                return `Color3.fromRGB(${Math.random()*255},${Math.random()*255},${Math.random()*255})`;
            });
        }

        // 3. Animation Injection
        if (isAnim) code = animCode + code;

        return code;
    }

    function generateOutputs() {
        const source = document.getElementById('scriptInput').value;
        const count = Math.min(Math.max(document.getElementById('fileCount').value, 3), 30);
        const wrapper = document.getElementById('outputsWrapper');
        if (!source.trim()) return alert("Paste code!");
        
        wrapper.innerHTML = "";
        for (let i = 1; i <= count; i++) {
            const id = `out_${i}`;
            const card = document.createElement('div');
            card.className = 'output-card';
            card.innerHTML = `
                <label>Variation ${i}</label>
                <textarea id="${id}" class="output-area" readonly>${processCode(source)}</textarea>
                <button class="copy-btn" onclick="copyText('${id}', this)">Copy Variation ${i}</button>
            `;
            wrapper.appendChild(card);
        }
    }

    function copyText(id, btn) {
        const t = document.getElementById(id);
        t.select();
        document.execCommand('copy');
        btn.innerText = "Copied!";
        btn.classList.add('success');
        setTimeout(() => { btn.innerText = "Copy Variation " + id.split('_')[1]; btn.classList.remove('success'); }, 1500);
    }
</script>

</body>
</html>
