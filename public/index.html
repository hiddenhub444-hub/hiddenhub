<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ScriptsMaker AI | Source Engine</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #0b0e14; color: #cfd8dc; font-family: 'Segoe UI', sans-serif; }
        .glass { background: #161b22; border: 1px solid #30363d; border-radius: 12px; }
        .code-view { font-family: 'Consolas', monospace; color: #79c0ff; background: #010409; }
        .btn-primary { background: #238636; transition: 0.2s; }
        .btn-primary:hover { background: #2ea043; }
    </style>
</head>
<body class="p-4 md:p-10">

    <div class="max-w-6xl mx-auto grid grid-cols-1 lg:grid-cols-2 gap-8">
        
        <div class="glass p-6 space-y-4">
            <h1 class="text-2xl font-bold text-white">ScriptsMaker AI</h1>
            <p class="text-sm text-gray-400">Ask for any logic found in your uploaded files (Jump, Speed, TP, Auto-Duel, etc.)</p>
            
            <div id="chat-history" class="h-48 overflow-y-auto border-b border-gray-700 mb-4 p-2 text-sm space-y-2">
                <div class="text-green-400">AI: System Loaded. Mapping logic from 10 files...</div>
            </div>

            <textarea id="ai-prompt" class="w-full bg-black border border-gray-600 rounded p-3 h-32 focus:border-blue-500 outline-none" 
                placeholder="e.g. 'Make a speed button and a jump boost button and also auto grab'"></textarea>
            
            <div class="flex gap-2">
                <button onclick="generateAI()" class="btn-primary text-white px-6 py-2 rounded font-bold flex-1">GENERATE SCRIPT</button>
                <button onclick="document.getElementById('ai-prompt').value=''" class="bg-gray-700 px-4 rounded">Clear</button>
            </div>
        </div>

        <div class="glass p-6 flex flex-col">
            <div class="flex justify-between items-center mb-2">
                <span class="text-xs font-mono uppercase text-gray-500">Output: script.lua</span>
                <button onclick="copyCode()" class="text-blue-400 text-xs hover:underline">Copy Code</button>
            </div>
            <pre id="lua-output" class="code-view p-4 rounded h-full overflow-auto text-xs border border-gray-800">-- Script logic will appear here...</pre>
        </div>
    </div>

    <script>
        // CORE LOGIC ENGINE (Extracted from your specific .txt files)
        const FILE_LOGIC = {
            speed: {
                match: ["speed", "velocity", "fast", "walkspeed"],
                code: "-- Logic: Ambitous duels clone\nlocal BoostSpeed = 30\ngame.Players.LocalPlayer.Character.Humanoid.WalkSpeed = BoostSpeed"
            },
            jump: {
                match: ["jump", "hop", "high jump", "jumpboost"],
                code: "-- Logic: Ambitous duels clone\nlocal HOP_POWER = 35\nlocal hum = game.Players.LocalPlayer.Character.Humanoid\nhum.JumpPower = HOP_POWER\nhum.UseJumpPower = true"
            },
            teleport: {
                match: ["tp", "teleport", "move to"],
                code: "-- Logic: Tp rag / Tp best 2\nlocal function move(pos)\n    local char = game.Players.LocalPlayer.Character\n    if char then\n        char:PivotTo(CFrame.new(pos))\n        char.HumanoidRootPart.AssemblyLinearVelocity = Vector3.new(0,0,0)\n    end\nend"
            },
            autograb: {
                match: ["grab", "steal", "auto grab", "collect"],
                code: "-- Logic: Semitp (3).txt\nfor _, v in pairs(workspace:GetDescendants()) do\n    if v:IsA('ProximityPrompt') then\n        fireproximityprompt(v)\n    end\nend"
            },
            esp: {
                match: ["esp", "xray", "see through", "timer"],
                code: "-- Logic: Esp Timer.txt\nlocal billboard = Instance.new('BillboardGui')\nbillboard.AlwaysOnTop = true\nbillboard.Size = UDim2.new(0, 50, 0, 25)\nbillboard.Parent = game.CoreGui"
            },
            antiragdoll: {
                match: ["ragdoll", "unwalk", "anti ragdoll"],
                code: "-- Logic: Semitp (3).txt\ngame.Players.LocalPlayer.Character.Humanoid:SetStateEnabled(Enum.HumanoidStateType.Ragdoll, false)"
            },
            autoduel: {
                match: ["duel", "auto duel", "silent duel"],
                code: "-- Logic: AutoDuelSilent Test By Prince\nlocal waypoints = {Vector3.new(-475,-7,96), Vector3.new(-483,-5,95)}\n-- Moving to waypoints..."
            },
            float: {
                match: ["float", "fly", "dodge", "hover"],
                code: "-- Logic: floatsrcBYME.txt\nlocal bPos = Instance.new('BodyPosition')\nbPos.MaxForce = Vector3.new(0, math.huge, 0)\nbPos.P = 10000\nbPos.Parent = game.Players.LocalPlayer.Character.HumanoidRootPart"
            }
        };

        function generateAI() {
            const prompt = document.getElementById('ai-prompt').value.toLowerCase();
            const output = document.getElementById('lua-output');
            const chat = document.getElementById('chat-history');
            
            let finalScript = "-- [[ SCRIPTSMAKER GENERATED SCRIPT ]]\n-- Compiled from your reference files\n\n";
            let found = false;

            // Search the logic database for matches in the user prompt
            for (const category in FILE_LOGIC) {
                const item = FILE_LOGIC[category];
                if (item.match.some(keyword => prompt.includes(keyword))) {
                    finalScript += item.code + "\n\n";
                    found = true;
                }
            }

            if (!found) {
                finalScript += "-- No specific logic found. Try words like 'Speed', 'Jump', 'TP', or 'Grab'.";
            }

            output.innerText = finalScript;
            chat.innerHTML += `<div><span class="text-blue-400">User:</span> ${prompt}</div>`;
            chat.innerHTML += `<div class="text-green-400">AI: Logic found and injected.</div>`;
            chat.scrollTop = chat.scrollHeight;
        }

        function copyCode() {
            const code = document.getElementById('lua-output').innerText;
            navigator.clipboard.writeText(code);
            alert("Script Copied!");
        }
    </script>
</body>
</html>
