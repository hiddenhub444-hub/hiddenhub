<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gemini | ScriptsMaker AI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500&display=swap');
        body { background-color: #131314; color: #e3e3e3; font-family: 'Google Sans', sans-serif; margin: 0; display: flex; height: 100vh; overflow: hidden; }
        
        /* Sidebar */
        .sidebar { width: 280px; background-color: #1e1f20; display: flex; flex-direction: column; padding: 12px; }
        .new-chat-btn { background-color: #1a1b1c; color: #8e918f; border-radius: 50px; padding: 10px 16px; font-size: 14px; display: flex; align-items: center; gap: 12px; margin-bottom: 30px; border: none; cursor: pointer; transition: 0.2s; width: fit-content; }
        .new-chat-btn:hover { background-color: #333537; color: #e3e3e3; }
        .history-item { padding: 10px 12px; border-radius: 50px; font-size: 14px; display: flex; align-items: center; gap: 12px; cursor: pointer; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: #c4c7c5; }
        .history-item:hover, .history-item.active { background-color: #333537; color: #fff; }

        /* Main Area */
        .main-content { flex: 1; display: flex; flex-direction: column; position: relative; }
        .chat-scroll { flex: 1; overflow-y: auto; padding-top: 50px; scroll-behavior: smooth; }
        .chat-container { width: 100%; max-width: 820px; margin: 0 auto; padding: 0 20px; }

        /* Gemini Text Gradient */
        .welcome-text { font-size: 56px; font-weight: 500; background: linear-gradient(74deg, #4285f4 0, #9b72cb 9%, #d96570 20%, #131314 80%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin-bottom: 40px; }

        /* Bubble Styles */
        .user-query { font-size: 16px; margin-bottom: 30px; display: flex; gap: 20px; align-items: flex-start; justify-content: flex-end; text-align: right; }
        .ai-response { margin-bottom: 50px; display: flex; gap: 20px; align-items: flex-start; line-height: 1.7; }
        .ai-icon { width: 32px; height: 32px; background: linear-gradient(to bottom right, #4285f4, #d96570); border-radius: 50%; flex-shrink: 0; }
        
        /* Lua Code Block */
        .code-container { background-color: #000; border: 1px solid #444746; border-radius: 12px; margin-top: 15px; }
        .code-header { display: flex; justify-content: space-between; padding: 10px 16px; background: #1e1f20; border-radius: 12px 12px 0 0; font-size: 12px; color: #c4c7c5; border-bottom: 1px solid #444746; }
        pre { padding: 16px; font-family: 'Consolas', monospace; font-size: 14px; color: #a5d6ff; overflow-x: auto; margin: 0; }

        /* Input Bar */
        .input-area { width: 100%; max-width: 820px; margin: 0 auto 30px; padding: 0 20px; }
        .input-box { background-color: #1e1f20; border-radius: 32px; padding: 12px 24px; display: flex; align-items: center; gap: 15px; }
        textarea { flex: 1; background: transparent; border: none; outline: none; color: #e3e3e3; font-size: 16px; resize: none; max-height: 200px; }
        
        .hidden { display: none !important; }
    </style>
</head>
<body>

    <nav class="sidebar">
        <button class="new-chat-btn" onclick="startFreshChat()">
            <i class="fa-solid fa-plus"></i> <span>New chat</span>
        </button>
        <div class="text-xs font-medium text-gray-500 px-3 mb-3 uppercase tracking-widest">Recent</div>
        <div id="history-container" class="space-y-1"></div>
    </nav>

    <main class="main-content">
        <div class="chat-scroll" id="scroll-box">
            <div class="chat-container" id="welcome-view">
                <h1 class="welcome-text">Hello, ScriptsMaker</h1>
                <div class="grid grid-cols-2 gap-4">
                    <div class="bg-[#1e1f20] p-6 rounded-2xl hover:bg-[#333537] cursor-pointer" onclick="quickPrompt('Make a draggable red GUI')">
                        <p class="text-sm">Generate the Insane Duels UI with red gradient...</p>
                    </div>
                    <div class="bg-[#1e1f20] p-6 rounded-2xl hover:bg-[#333537] cursor-pointer" onclick="quickPrompt('Add float and speed boost')">
                        <p class="text-sm">Inject physics logic from your txt files...</p>
                    </div>
                </div>
            </div>
            <div class="chat-container hidden" id="chat-thread"></div>
        </div>

        <div class="input-area">
            <div class="input-box">
                <textarea id="prompt-input" rows="1" placeholder="Enter a prompt here" onkeydown="handleKey(event)"></textarea>
                <i id="send-icon" class="fa-solid fa-paper-plane text-gray-600 cursor-pointer text-xl" onclick="sendMessage()"></i>
            </div>
        </div>
    </main>

    <script>
        const chatThread = document.getElementById('chat-thread');
        const welcomeView = document.getElementById('welcome-view');
        const promptInput = document.getElementById('prompt-input');
        const historyContainer = document.getElementById('history-container');
        
        let currentChatId = null;
        let chats = {}; // Stores { id: { title: "", messages: [] } }

        function handleKey(e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        }

        function sendMessage() {
            const text = promptInput.value.trim();
            if (!text) return;

            // First message logic: Name the chat
            if (!currentChatId) {
                currentChatId = Date.now();
                chats[currentChatId] = { title: text, messages: [] };
                addSidebarItem(currentChatId, text);
                welcomeView.classList.add('hidden');
                chatThread.classList.remove('hidden');
                chatThread.innerHTML = '';
            }

            // Append User Message
            addMessageToUI('user', text);
            chats[currentChatId].messages.push({ role: 'user', content: text });

            // AI Logic Generation
            setTimeout(() => {
                let code = generateLuaLogic(text);
                addMessageToUI('ai', `Here is your Roblox script logic based on your uploaded files:`, code);
                chats[currentChatId].messages.push({ role: 'ai', content: "Generated code.", code: code });
            }, 600);

            promptInput.value = '';
            promptInput.style.height = 'auto';
        }

        function addMessageToUI(role, content, code = null) {
            const div = document.createElement('div');
            div.className = role === 'user' ? 'user-query' : 'ai-response';
            
            let html = role === 'ai' ? '<div class="ai-icon"></div><div class="w-full">' : '<div class="w-full">';
            html += `<p>${content}</p>`;
            
            if (code) {
                html += `
                <div class="code-container">
                    <div class="code-header"><span>lua</span><span class="cursor-pointer" onclick="copyCode(this)">Copy code</span></div>
                    <pre><code>${code}</code></pre>
                </div>`;
            }
            html += '</div>';
            div.innerHTML = html;
            chatThread.appendChild(div);
            document.getElementById('scroll-box').scrollTop = document.getElementById('scroll-box').scrollHeight;
        }

        function generateLuaLogic(input) {
            let output = "-- INSANE DUELS LOGIC\n";
            const p = input.toLowerCase();
            if (p.includes("gui") || p.includes("menu")) output += "local Main = Instance.new('Frame')\nMain.Draggable = true\nInstance.new('UIStroke', Main).Color = Color3.fromRGB(255,0,0)\n";
            if (p.includes("float")) output += "local bp = Instance.new('BodyPosition')\nbp.MaxForce = Vector3.new(0, math.huge, 0)\nbp.D = 600\n";
            if (p.includes("speed")) output += "game.Players.LocalPlayer.Character.Humanoid.WalkSpeed = 30\n";
            if (p.includes("esp")) output += "local bb = Instance.new('BillboardGui')\nbb.AlwaysOnTop = true\n";
            return output;
        }

        function addSidebarItem(id, title) {
            const item = document.createElement('div');
            item.className = 'history-item active';
            item.id = `sidebar-${id}`;
            item.innerHTML = `<i class="fa-regular fa-message text-xs"></i> <span>${title}</span>`;
            item.onclick = () => loadChat(id);
            historyContainer.prepend(item);
        }

        function loadChat(id) {
            currentChatId = id;
            welcomeView.classList.add('hidden');
            chatThread.classList.remove('hidden');
            chatThread.innerHTML = '';
            
            chats[id].messages.forEach(msg => {
                addMessageToUI(msg.role, msg.content, msg.code);
            });

            document.querySelectorAll('.history-item').forEach(el => el.classList.remove('active'));
            document.getElementById(`sidebar-${id}`).classList.add('active');
        }

        function startFreshChat() {
            currentChatId = null;
            welcomeView.classList.remove('hidden');
            chatThread.classList.add('hidden');
            chatThread.innerHTML = '';
            promptInput.value = '';
            document.querySelectorAll('.history-item').forEach(el => el.classList.remove('active'));
        }

        function copyCode(btn) {
            const code = btn.parentElement.nextElementSibling.innerText;
            navigator.clipboard.writeText(code);
            btn.innerText = "Copied!";
            setTimeout(() => btn.innerText = "Copy code", 2000);
        }

        function quickPrompt(t) { promptInput.value = t; sendMessage(); }
    </script>
</body>
</html>
