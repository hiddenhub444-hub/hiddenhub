<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ScriptsMaker AI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500&display=swap');
        
        body { background-color: #131314; color: #e3e3e3; font-family: 'Google Sans', sans-serif; margin: 0; display: flex; height: 100vh; overflow: hidden; }
        
        /* Sidebar Styles */
        .sidebar { width: 280px; background-color: #1e1f20; display: flex; flex-direction: column; padding: 12px; transition: all 0.3s ease; }
        .new-chat-btn { background-color: #1a1b1c; color: #8e918f; border-radius: 50px; padding: 10px 16px; font-size: 14px; display: flex; align-items: center; gap: 12px; margin-bottom: 30px; border: none; cursor: pointer; transition: background 0.2s; width: fit-content; }
        .new-chat-btn:hover { background-color: #333537; color: #e3e3e3; }
        .recent-title { font-size: 14px; font-weight: 500; padding: 0 12px 10px; color: #e3e3e3; }
        .chat-history-item { padding: 10px 12px; border-radius: 50px; font-size: 14px; display: flex; align-items: center; gap: 12px; cursor: pointer; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .chat-history-item:hover { background-color: #333537; }

        /* Main Chat Area */
        .main-content { flex: 1; display: flex; flex-direction: column; position: relative; }
        .chat-scroll { flex: 1; overflow-y: auto; display: flex; flex-direction: column; align-items: center; padding-top: 50px; }
        .chat-container { width: 100%; max-width: 820px; padding: 0 20px; }

        /* Gemini Welcome Style */
        .welcome-text { font-size: 56px; font-weight: 500; background: linear-gradient(74deg, #4285f4 0, #9b72cb 9%, #d96570 20%, #131314 80%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin-bottom: 40px; }

        /* Messages */
        .user-query { font-size: 18px; margin-bottom: 30px; display: flex; gap: 20px; align-items: flex-start; }
        .ai-response { margin-bottom: 50px; display: flex; gap: 20px; align-items: flex-start; line-height: 1.6; }
        .ai-icon { width: 30px; height: 30px; background: linear-gradient(to bottom right, #4285f4, #d96570); border-radius: 50%; flex-shrink: 0; }
        .user-icon { width: 30px; height: 30px; background: #333537; border-radius: 50%; flex-shrink: 0; }

        /* Lua Code Block */
        .code-container { background-color: #000; border: 1px solid #444746; border-radius: 12px; margin-top: 15px; position: relative; }
        .code-header { display: flex; justify-content: space-between; padding: 8px 16px; background: #1e1f20; border-top-left-radius: 12px; border-top-right-radius: 12px; font-size: 12px; color: #c4c7c5; }
        pre { padding: 16px; font-family: 'Consolas', monospace; font-size: 14px; color: #a5d6ff; overflow-x: auto; white-space: pre-wrap; margin: 0; }

        /* Input Bar */
        .input-wrapper { width: 100%; max-width: 820px; margin: 0 auto 30px; padding: 0 20px; }
        .input-box { background-color: #1e1f20; border-radius: 32px; padding: 8px 24px; display: flex; align-items: center; gap: 15px; min-height: 60px; }
        textarea { flex: 1; background: transparent; border: none; outline: none; color: #e3e3e3; font-size: 16px; resize: none; max-height: 200px; padding: 10px 0; }
        .input-actions { display: flex; gap: 20px; color: #c4c7c5; font-size: 20px; }
        .input-actions i:hover { color: #fff; cursor: pointer; }
        
        .hidden { display: none !important; }
    </style>
</head>
<body>

    <nav class="sidebar">
        <button class="new-chat-btn" onclick="newChat()">
            <i class="fa-solid fa-plus"></i>
            <span>New chat</span>
        </button>
        <div class="recent-title">Recent</div>
        <div id="history-list" class="flex-grow overflow-y-auto">
            </div>
    </nav>

    <div class="main-content">
        <div class="chat-scroll" id="scroll-area">
            <div class="chat-container" id="welcome-ui">
                <h1 class="welcome-text">Hello, ScriptsMaker</h1>
                <div class="grid grid-cols-2 gap-4">
                    <div class="bg-[#1e1f20] p-5 rounded-2xl hover:bg-[#333537] cursor-pointer" onclick="quickAction('Make an Insane Duels UI')">
                        <p class="text-sm">Create a draggable red GUI with tabs...</p>
                    </div>
                    <div class="bg-[#1e1f20] p-5 rounded-2xl hover:bg-[#333537] cursor-pointer" onclick="quickAction('Give me float and speed logic')">
                        <p class="text-sm">Get physics logic from floatsrc and Ambitious...</p>
                    </div>
                </div>
            </div>

            <div class="chat-container hidden" id="chat-thread">
                </div>
        </div>

        <div class="input-wrapper">
            <div class="input-box">
                <textarea id="main-input" rows="1" placeholder="Enter a prompt here" onkeydown="checkEnter(event)"></textarea>
                <div class="input-actions">
                    <i class="fa-regular fa-image"></i>
                    <i id="send-btn" class="fa-solid fa-paper-plane text-blue-500 hidden" onclick="generateResponse()"></i>
                </div>
            </div>
            <p class="text-center text-[11px] text-[#8e918f] mt-3">ScriptsMaker AI may provide inaccurate info. Check the Lua logic before executing.</p>
        </div>
    </div>

    <script>
        const input = document.getElementById('main-input');
        const sendBtn = document.getElementById('send-btn');
        const welcomeUI = document.getElementById('welcome-ui');
        const chatThread = document.getElementById('chat-thread');
        const historyList = document.getElementById('history-list');

        // Logic from your specific files
        const LOGIC_SOURCE = {
            gui: `-- Source: Rebrand Kawatan & Ambitious\nlocal Main = Instance.new("Frame")\nMain.BackgroundColor3 = Color3.fromRGB(15,15,15)\nlocal Stroke = Instance.new("UIStroke", Main)\nStroke.Color = Color3.fromRGB(255,0,0)\nStroke.Thickness = 2`,
            float: `-- Source: floatsrcBYME.txt\nlocal bp = Instance.new("BodyPosition", hrp)\nbp.MaxForce = Vector3.new(0, math.huge, 0)\nbp.P = 10000\nbp.D = 600`,
            speed: `-- Source: Ambitous duels clone\ngame.Players.LocalPlayer.Character.Humanoid.WalkSpeed = 30`,
            esp: `-- Source: Esp Timer.txt\nlocal billboard = Instance.new("BillboardGui")\nbillboard.AlwaysOnTop = true\nbillboard.Size = UDim2.new(0, 50, 0, 25)`
        };

        input.addEventListener('input', () => {
            sendBtn.classList.toggle('hidden', input.value.trim() === "");
            input.style.height = 'auto';
            input.style.height = input.scrollHeight + 'px';
        });

        function checkEnter(e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                generateResponse();
            }
        }

        function generateResponse() {
            const prompt = input.value.trim();
            if (!prompt) return;

            welcomeUI.classList.add('hidden');
            chatThread.classList.remove('hidden');

            // Add User Msg
            chatThread.innerHTML += `
                <div class="user-query">
                    <div class="user-icon"></div>
                    <div>${prompt}</div>
                </div>`;

            // Process Logic based on keywords
            let responseCode = "-- Generated Lua Script\n";
            if (prompt.toLowerCase().includes("gui")) responseCode += LOGIC_SOURCE.gui + "\n";
            if (prompt.toLowerCase().includes("float")) responseCode += LOGIC_SOURCE.float + "\n";
            if (prompt.toLowerCase().includes("speed")) responseCode += LOGIC_SOURCE.speed + "\n";
            if (prompt.toLowerCase().includes("esp")) responseCode += LOGIC_SOURCE.esp + "\n";

            // Add AI Msg
            chatThread.innerHTML += `
                <div class="ai-response">
                    <div class="ai-icon"></div>
                    <div class="w-full">
                        <p>Based on your files, here is the generated logic for your request:</p>
                        <div class="code-container">
                            <div class="code-header"><span>lua</span><span class="cursor-pointer" onclick="copyCode(this)">Copy code</span></div>
                            <pre>${responseCode}</pre>
                        </div>
                    </div>
                </div>`;

            updateHistory(prompt);
            input.value = '';
            input.style.height = 'auto';
            sendBtn.classList.add('hidden');
            document.getElementById('scroll-area').scrollTop = document.getElementById('scroll-area').scrollHeight;
        }

        function updateHistory(text) {
            const item = document.createElement('div');
            item.className = 'chat-history-item';
            item.innerHTML = `<i class="fa-regular fa-message"></i> ${text}`;
            historyList.prepend(item);
        }

        function newChat() {
            chatThread.innerHTML = '';
            welcomeUI.classList.remove('hidden');
            chatThread.classList.add('hidden');
            input.value = '';
        }

        function copyCode(btn) {
            const code = btn.parentElement.nextElementSibling.innerText;
            navigator.clipboard.writeText(code);
            btn.innerText = "Copied!";
            setTimeout(() => btn.innerText = "Copy code", 2000);
        }

        function quickAction(text) {
            input.value = text;
            generateResponse();
        }
    </script>
</body>
</html>
