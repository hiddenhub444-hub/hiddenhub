=<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Limited Ext Generator</title>
    <style>
        :root {
            --primary: #58a6ff;
            --bg: #0d1117;
            --card-bg: #161b22;
            --border: #30363d;
            --success: #238636;
        }

        body {
            font-family: 'Segoe UI', Tahoma, sans-serif;
            background-color: var(--bg);
            color: #c9d1d9;
            margin: 0;
            display: flex;
        }

        /* Sidebar Styling */
        .sidebar {
            width: 260px;
            background: var(--card-bg);
            height: 100vh;
            padding: 25px;
            border-right: 1px solid var(--border);
            position: fixed;
            box-sizing: border-box;
            overflow-y: auto;
        }

        .sidebar h3 { font-size: 14px; color: var(--primary); margin-top: 0; margin-bottom: 20px; text-transform: uppercase; letter-spacing: 1px; }

        .setting-group { margin-bottom: 20px; padding-bottom: 15px; border-bottom: 1px solid #21262d; }
        
        .sidebar label { 
            font-weight: bold; 
            font-size: 11px; 
            display: block; 
            margin-bottom: 8px; 
            color: #8b949e;
        }

        .sidebar input[type="number"] {
            width: 100%;
            background: var(--bg);
            border: 1px solid var(--border);
            color: white;
            padding: 8px;
            border-radius: 5px;
        }

        /* Modern Toggle Switch */
        .switch-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 5px;
        }

        .switch {
            position: relative;
            display: inline-block;
            width: 34px;
            height: 18px;
        }

        .switch input { opacity: 0; width: 0; height: 0; }

        .slider {
            position: absolute;
            cursor: pointer;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: #30363d;
            transition: .4s;
            border-radius: 20px;
        }

        .slider:before {
            position: absolute;
            content: "";
            height: 12px; width: 12px;
            left: 3px; bottom: 3px;
            background-color: white;
            transition: .4s;
            border-radius: 50%;
        }

        input:checked + .slider { background-color: var(--success); }
        input:checked + .slider:before { transform: translateX(16px); }

        /* Main Content */
        .main-content {
            margin-left: 260px;
            padding: 40px;
            width: 100%;
            box-sizing: border-box;
        }

        .input-area { 
            height: 250px; 
            width: 100%;
            background: var(--bg);
            color: #7ee787;
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 15px;
            font-family: 'Courier New', monospace;
            margin-bottom: 20px;
        }

        .gen-btn {
            width: 100%;
            background-color: var(--success);
            color: white;
            border: none;
            padding: 18px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            font-size: 16px;
            margin-bottom: 40px;
        }

        .outputs-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 20px;
        }

        .output-card {
            background: var(--card-bg);
            padding: 20px;
            border-radius: 10px;
            border: 1px solid var(--border);
        }

        .output-area { height: 180px; font-size: 11px; width: 100%; margin-bottom: 15px; background: var(--bg); color: #c9d1d9; border: 1px solid var(--border); }

        .copy-btn {
            width: 100%;
            background: #21262d;
            color: #c9d1d9;
            border: 1px solid var(--border);
            padding: 10px;
            border-radius: 6px;
            cursor: pointer;
        }

        .copy-btn.success { background: var(--success); color: white; border-color: var(--success); }
    </style>
</head>
<body>

<div class="sidebar">
    <h3>SETTINGS</h3>
    
    <div class="setting-group">
        <label>FILES:</label>
        <input type="number" id="fileCount" value="3" min="1" max="30">
    </div>

    <div class="setting-group">
        <label>ANIMATION:</label>
        <div class="switch-container">
            <span style="font-size: 12px;">Intro UI</span>
            <label class="switch">
                <input type="checkbox" id="animToggle">
                <span class="slider"></span>
            </label>
        </div>
    </div>

    <div class="setting-group">
        <label>PRINTS:</label>
        <div class="switch-container">
            <span>Enabled</span>
            <label class="switch">
                <input type="checkbox" id="printToggle">
                <span class="slider"></span>
            </label>
        </div>
        <input type="number" id="printAmount" value="5" min="1" max="100">
    </div>

    <div class="setting-group">
        <label>FONT RANDOMISER:</label>
        <div class="switch-container">
            <span>Random Fonts</span>
            <label class="switch">
                <input type="checkbox" id="fontToggle">
                <span class="slider"></span>
            </label>
        </div>
    </div>
</div>

<div class="main-content">
    <div class="container">
        <h1>Limited Ext Generator</h1>
        <textarea id="scriptInput" class="input-area" placeholder="Paste Roblox source here..."></textarea>
        
        <button class="gen-btn" onclick="generateOutputs()">Confirm & Generate</button>

        <div id="outputsWrapper" class="outputs-grid"></div>
    </div>
</div>

<script>
    const randomNames = ["Vortex", "Nebula Hub", "FrostWare", "Aether X", "ShadowLvl", "Zenith V4", "Titanium", "Phantom Script"];
    const robloxFonts = ["Enum.Font.GothamBold", "Enum.Font.GothamMedium", "Enum.Font.Arcade", "Enum.Font.Fantasy", "Enum.Font.SciFi", "Enum.Font.Code", "Enum.Font.Highway", "Enum.Font.Bangers"];

    function processCode(source) {
        let code = source;
        const usePrint = document.getElementById('printToggle').checked;
        const printCount = document.getElementById('printAmount').value;
        const useFont = document.getElementById('fontToggle').checked;

        // 1. Randomize Color3.fromRGB
        code = code.replace(/Color3\.fromRGB\(\d+,\s*\d+,\s*\d+\)/g, () => {
            return `Color3.fromRGB(${Math.floor(Math.random()*255)}, ${Math.floor(Math.random()*255)}, ${Math.floor(Math.random()*255)})`;
        });

        // 2. Randomize Titles ONLY (Ignores buttons by checking if the line contains 'Button')
        const lines = code.split('\n');
        for (let i = 0; i < lines.length; i++) {
            // Only replace .Text if the line doesn't mention "Button" or "Click"
            if (lines[i].includes(".Text") && !lines[i].toLowerCase().includes("button") && !lines[i].toLowerCase().includes("click")) {
                lines[i] = lines[i].replace(/"([^"]+)"/, () => {
                    return `"${randomNames[Math.floor(Math.random() * randomNames.length)]}"`;
                });
            }
            
            // 3. Randomize Fonts (if enabled)
            if (useFont && lines[i].includes(".Font")) {
                lines[i] = lines[i].replace(/Enum\.Font\.[a-zA-Z]+/, () => {
                    return robloxFonts[Math.floor(Math.random() * robloxFonts.length)];
                });
            }
        }
        code = lines.join('\n');

        // 4. Inject Prints
        if (usePrint) {
            code = `for i = 1, ${printCount} do print("LEAKED BY FPSL https://discord.gg/VuHrBW5q") end\n` + code;
        }

        return code;
    }

    function generateOutputs() {
        const source = document.getElementById('scriptInput').value;
        const count = document.getElementById('fileCount').value;
        const wrapper = document.getElementById('outputsWrapper');
        if (!source.trim()) return alert("Paste code!");

        wrapper.innerHTML = "";
        for (let i = 1; i <= count; i++) {
            const id = `out_${i}`;
            const card = document.createElement('div');
            card.className = 'output-card';
            card.innerHTML = `
                <label>VARIATION ${i}</label>
                <textarea id="${id}" class="output-area" readonly>${processCode(source)}</textarea>
                <button class="copy-btn" onclick="copyText('${id}', this)">Copy Code</button>
            `;
            wrapper.appendChild(card);
        }
    }

    function copyText(id, btn) {
        const area = document.getElementById(id);
        area.select();
        document.execCommand('copy');
        btn.innerText = "COPIED!";
        btn.classList.add('success');
        setTimeout(() => { btn.innerText = "Copy Code"; btn.classList.remove('success'); }, 1500);
    }
</script>

</body>
</html>
