<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ScriptsMaker AI | Lua Generator</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body { background-color: #0f172a; color: #e2e8f0; font-family: 'Inter', sans-serif; }
        .glass { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.1); }
        .lua-output { font-family: 'Fira Code', monospace; background: #000; color: #3b82f6; }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center p-4 md:p-8">

    <header class="w-full max-w-5xl flex justify-between items-center mb-8">
        <h1 class="text-3xl font-bold bg-gradient-to-r from-blue-400 to-cyan-400 bg-clip-text text-transparent">
            ScriptsMaker <span class="text-sm font-light text-slate-500 italic">v1.0</span>
        </h1>
        <div class="flex gap-4">
            <a href="#" class="hover:text-blue-400 transition"><i class="fab fa-github"></i> Source</a>
        </div>
    </header>

    <main class="w-full max-w-5xl grid grid-cols-1 lg:grid-cols-2 gap-6">
        
        <section class="flex flex-col gap-4">
            <div class="glass p-6 rounded-2xl flex flex-col gap-4">
                <h2 class="text-lg font-semibold border-b border-slate-700 pb-2">AI Input Console</h2>
                
                <div id="chat-box" class="h-64 overflow-y-auto space-y-4 p-2 text-sm">
                    <div class="text-cyan-400"><b>System:</b> Ready to clone UI. Paste an image or tell me what features you want (Speed, Auto Grab, ESP, etc.)</div>
                </div>

                <div class="relative">
                    <textarea id="user-input" class="w-full bg-slate-900 border border-slate-700 rounded-xl p-3 text-sm focus:outline-none focus:border-blue-500 h-24" placeholder="e.g., 'Make the speed button work with velocity boost 50'"></textarea>
                    <div class="flex mt-2 gap-2">
                        <button onclick="processRequest()" class="flex-1 bg-blue-600 hover:bg-blue-500 text-white py-2 rounded-lg font-medium transition">Generate Script</button>
                        <label class="bg-slate-700 hover:bg-slate-600 p-2 rounded-lg cursor-pointer">
                            <i class="fas fa-image"></i>
                            <input type="file" id="image-input" class="hidden" accept="image/*">
                        </label>
                    </div>
                </div>
            </div>
        </section>

        <section class="glass p-6 rounded-2xl flex flex-col gap-4">
            <div class="flex justify-between items-center border-b border-slate-700 pb-2">
                <h2 class="text-lg font-semibold">Generated Lua Logic</h2>
                <button onclick="copyToClipboard()" class="text-xs bg-slate-800 hover:bg-slate-700 px-3 py-1 rounded border border-slate-600 transition">Copy Code</button>
            </div>
            
            <pre id="output-code" class="lua-output p-4 rounded-xl h-[400px] overflow-auto text-xs leading-relaxed">
-- Waiting for prompt...
-- Logic mapped from: 
-- [Ambitous duels, Tp rag, Esp Timer, etc.]
            </pre>
        </section>

    </main>

    <script>
        // Mapping keywords to logic from your provided files
        const LOGIC_DATABASE = {
            speed: `local function setSpeed(val) \n    game.Players.LocalPlayer.Character.Humanoid.WalkSpeed = val or 30 \nend`,
            grab: `-- Logic from Semitp (3).txt\nlocal function autoGrab() \n    for _,v in pairs(workspace:GetDescendants()) do \n        if v:IsA("ProximityPrompt") then fireproximityprompt(v) end \n    end \nend`,
            esp: `-- Logic from Esp Timer.txt\nlocal function createESP(part, label) \n    local bb = Instance.new("BillboardGui", part)\n    bb.AlwaysOnTop = true\n    bb.Size = UDim2.new(0,50,0,25)\nend`,
            ragdoll: `-- Logic from Ambitous duels clone.txt\nlocal function antiRagdoll() \n    game.Players.LocalPlayer.Character.Humanoid:SetStateEnabled(Enum.HumanoidStateType.Ragdoll, false) \nend`
        };

        function processRequest() {
            const input = document.getElementById('user-input').value.toLowerCase();
            const output = document.getElementById('output-code');
            const chat = document.getElementById('chat-box');

            let generatedScript = "-- Generated by ScriptsMaker AI\n\n";

            // Keyword detection logic
            if (input.includes("speed") || input.includes("velocity")) {
                generatedScript += LOGIC_DATABASE.speed + "\n\n";
            }
            if (input.includes("grab") || input.includes("steal")) {
                generatedScript += LOGIC_DATABASE.grab + "\n\n";
            }
            if (input.includes("esp") || input.includes("xray")) {
                generatedScript += LOGIC_DATABASE.esp + "\n\n";
            }
            if (input.includes("ragdoll") || input.includes("unwalk")) {
                generatedScript += LOGIC_DATABASE.ragdoll + "\n\n";
            }

            if (generatedScript === "-- Generated by ScriptsMaker AI\n\n") {
                generatedScript += "-- No specific keywords detected. Please mention 'Speed', 'Grab', or 'ESP'.";
            }

            output.innerText = generatedScript;
            chat.innerHTML += `<div class="text-slate-300"><b>User:</b> ${input}</div>`;
            chat.innerHTML += `<div class="text-blue-400"><b>ScriptsMaker:</b> Script generated based on your files!</div>`;
            chat.scrollTop = chat.scrollHeight;
        }

        function copyToClipboard() {
            const text = document.getElementById('output-code').innerText;
            navigator.clipboard.writeText(text);
            alert("Script copied to clipboard!");
        }
    </script>
</body>
</html>
