<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gemini</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500&display=swap');
        
        body { background-color: #131314; color: #e3e3e3; font-family: 'Google Sans', sans-serif; margin: 0; display: flex; height: 100vh; overflow: hidden; }
        
        /* Sidebar */
        .sidebar { width: 280px; background-color: #1e1f20; display: flex; flex-direction: column; padding: 12px; border-right: 1px solid #333537; transition: all 0.3s; }
        .new-chat-btn { background-color: #1a1b1c; color: #8e918f; border-radius: 50px; padding: 12px 20px; font-size: 14px; display: flex; align-items: center; gap: 12px; margin-bottom: 30px; cursor: pointer; border: none; width: fit-content; }
        .new-chat-btn:hover { background-color: #333537; color: #fff; }
        .history-item { padding: 10px 16px; border-radius: 50px; font-size: 14px; cursor: pointer; color: #c4c7c5; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .history-item:hover, .history-item.active { background-color: #333537; color: #fff; }

        /* Main Chat Area */
        .main-content { flex: 1; display: flex; flex-direction: column; position: relative; width: 100%; }
        .chat-scroll { flex: 1; overflow-y: auto; scroll-behavior: smooth; display: flex; flex-direction: column; }
        .container { width: 100%; max-width: 820px; margin: 0 auto; padding: 20px; }

        /* Welcome Gradient */
        .welcome-text { font-size: 56px; font-weight: 500; background: linear-gradient(74deg, #4285f4, #9b72cb, #d96570); -webkit-background-clip: text; -webkit-text-fill-color: transparent; line-height: 1.2; }

        /* Message Logic - NO OVERLAP / NO CUTOFF */
        .msg-container { margin-bottom: 32px; width: 100%; display: flex; flex-direction: column; }
        .user-msg { align-self: flex-end; max-width: 85%; }
        .user-bubble { background-color: #28292a; padding: 12px 20px; border-radius: 22px; font-size: 16px; line-height: 1.6; word-wrap: break-word; overflow-wrap: break-word; white-space: pre-wrap; color: #e3e3e3; }
        .ai-msg { align-self: flex-start; display: flex; gap: 16px; width: 100%; }
        .ai-icon { width: 32px; height: 32px; background: linear-gradient(to bottom right, #4285f4, #d96570); border-radius: 50%; flex-shrink: 0; margin-top: 4px; }
        .ai-text { font-size: 16px; line-height: 1.7; color: #e3e3e3; flex: 1; word-wrap: break-word; overflow-wrap: break-word; }

        /* Input Area */
        .bottom-nav { padding: 20px; display: flex; flex-direction: column; align-items: center; background: #131314; }
        .input-holder { width: 100%; max-width: 820px; background-color: #1e1f20; border-radius: 32px; padding: 12px 24px; display: flex; align-items: center; gap: 15px; border: 2px solid transparent; }
        .input-holder:focus-within { background-color: #282a2c; }
        .input-holder.drag-active { border: 2px solid #4285f4; background: #232527; }
        textarea { flex: 1; background: transparent; border: none; outline: none; color: #e3e3e3; font-size: 16px; resize: none; max-height: 200px; padding: 5px 0; }

        .hidden { display: none !important; }
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-thumb { background: #333537; border-radius: 10px; }
    </style>
</head>
<body ondragover="event.preventDefault(); document.getElementById('input-box').classList.add('drag-active')" ondragleave="document.getElementById('input-box').classList.remove('drag-active')" ondrop="handleDrop(event)">

    <aside class="sidebar">
        <button class="new-chat-btn" onclick="resetUI()">
            <i class="fa-solid fa-plus"></i> <span>New chat</span>
        </button>
        <div class="text-xs font-medium text-gray-500 px-4 mb-4 uppercase tracking-widest">Recent</div>
        <div id="sidebar-history" class="overflow-y-auto space-y-1"></div>
    </aside>

    <main class="main-content">
        <div class="chat-scroll" id="scroll-target">
            <div id="welcome-screen" class="container mt-24">
                <h1 class="welcome-text">Hello, User</h1>
                <p class="text-2xl text-[#444746] mt-1 font-medium">How can I help you today?</p>
            </div>
            <div id="message-log" class="container hidden pt-10"></div>
        </div>

        <div class="bottom-nav">
            <div class="input-holder" id="input-box">
                <textarea id="prompt-in" rows="1" placeholder="Enter a prompt here" onkeydown="handleEnter(event)"></textarea>
                <div class="flex gap-4 items-center text-gray-400">
                    <label class="cursor-pointer hover:text-white"><i class="fa-regular fa-image text-xl"></i><input type="file" class="hidden" onchange="fileInput(event)"></label>
                    <i class="fa-solid fa-paper-plane text-blue-500 cursor-pointer text-xl" onclick="send()"></i>
                </div>
            </div>
            <p class="text-[11px] text-gray-500 mt-3">Gemini may display inaccurate info, so double-check its responses.</p>
        </div>
    </main>

    <script>
        const log = document.getElementById('message-log');
        const welcome = document.getElementById('welcome-screen');
        const input = document.getElementById('prompt-in');
        const history = document.getElementById('sidebar-history');
        
        let chatId = null;
        let memory = {}; // { id: [messages] }

        // Professional Safety Phrases
        const REFUSAL = "I am designed to be a helpful and safe AI assistant. I cannot fulfill this request as it violates safety policies regarding prohibited content.";

        function handleEnter(e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                send();
            }
            // Auto-resize textarea
            input.style.height = 'auto';
            input.style.height = input.scrollHeight + 'px';
        }

        function send() {
            const val = input.value.trim();
            if (!val) return;

            if (!chatId) {
                chatId = Date.now();
                memory[chatId] = [];
                welcome.classList.add('hidden');
                log.classList.remove('hidden');
                addToSidebar(chatId, val);
            }

            // User Message
            appendMsg('user', val);
            memory[chatId].push({role: 'user', content: val});

            // "Smart" Response Logic
            setTimeout(() => {
                let reply = processSmartly(val);
                appendMsg('ai', reply);
                memory[chatId].push({role: 'ai', content: reply});
            }, 600);

            input.value = '';
            input.style.height = 'auto';
        }

            function processSmartly(txt) {
            const low = txt.toLowerCase();
            
            // Banned topic check
            if (low.includes("exploit") || low.includes("hack") || low.includes("leak") || low.includes("cheat")) {
                return REFUSAL;
            }

            // Intelligent responses
            if (low.includes("hello") || low.includes("hi")) return "Hello! I'm your Gemini-powered assistant. How's your day going?";
            if (low.includes("who are you")) return "I am a Gemini AI, built to assist with creative tasks, answering questions, and providing information in a clear, concise way.";
            if (low.includes("what can you do")) return "I can help you write code, brainstorm ideas, analyze text, or just have a conversation. What's on your mind?";
            
            return "That's an interesting point. I'm analyzing your request—could you provide a bit more context so I can give you a truly helpful answer?";
        }

        function appendMsg(role, text) {
            const container = document.createElement('div');
            container.className = 'msg-container';
            
            if (role === 'user') {
                container.innerHTML = `<div class="user-msg"><div class="user-bubble">${text}</div></div>`;
            } else {
                container.innerHTML = `<div class="ai-msg"><div class="ai-icon"></div><div class="ai-text">${text}</div></div>`;
            }
            
            log.appendChild(container);
            document.getElementById('scroll-target').scrollTop = document.getElementById('scroll-target').scrollHeight;
        }

        function addToSidebar(id, title) {
            const div = document.createElement('div');
            div.className = 'history-item active';
            div.id = `hist-${id}`;
            div.innerHTML = `<i class="fa-regular fa-message text-xs"></i> <span>${title}</span>`;
            div.onclick = () => loadChat(id);
            history.prepend(div);
        }

        function loadChat(id) {
            chatId = id;
            welcome.classList.add('hidden');
            log.classList.remove('hidden');
            log.innerHTML = '';
            memory[id].forEach(m => appendMsg(m.role, m.content));
            document.querySelectorAll('.history-item').forEach(e => e.classList.remove('active'));
            document.getElementById(`hist-${id}`).classList.add('active');
        }

        function resetUI() {
            chatId = null;
            welcome.classList.remove('hidden');
            log.classList.add('hidden');
            log.innerHTML = '';
            input.value = '';
            document.querySelectorAll('.history-item').forEach(e => e.classList.remove('active'));
        }

        // File Handling
        function handleDrop(e) {
            e.preventDefault();
            document.getElementById('input-box').classList.remove('drag-active');
            const file = e.dataTransfer.files[0];
            if (file) input.value = `[Analyzing File: ${file.name}] `;
        }

        function fileInput(e) {
            const file = e.target.files[0];
            if (file) input.value = `[Analyzing File: ${file.name}] `;
        }
    </script>
</body>
</html>
