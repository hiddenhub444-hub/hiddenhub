<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gemini | Advanced AI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500&display=swap');
        
        :root {
            --bg-main: #131314;
            --bg-sidebar: #1e1f20;
            --bg-input: #1e1f20;
            --text-main: #e3e3e3;
            --text-gray: #c4c7c5;
            --gemini-blue: #4285f4;
        }

        body { 
            background-color: var(--bg-main); 
            color: var(--text-main); 
            font-family: 'Google Sans', sans-serif; 
            margin: 0; 
            display: flex; 
            height: 100vh; 
            overflow: hidden; 
        }

        /* Sidebar Styling */
        .sidebar { 
            width: 280px; 
            background-color: var(--bg-sidebar); 
            display: flex; 
            flex-direction: column; 
            padding: 12px; 
            border-right: 1px solid #333537;
            transition: transform 0.3s ease;
        }

        .new-chat-btn {
            background-color: #1a1b1c;
            color: var(--text-gray);
            border-radius: 50px;
            padding: 12px 16px;
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 20px;
            cursor: pointer;
            border: none;
            width: fit-content;
            transition: 0.2s;
        }

        .new-chat-btn:hover {
            background-color: #333537;
            color: #fff;
        }

        .history-section {
            flex: 1;
            overflow-y: auto;
        }

        .history-item {
            padding: 10px 16px;
            border-radius: 50px;
            font-size: 14px;
            cursor: pointer;
            color: var(--text-gray);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 4px;
        }

        .history-item:hover, .history-item.active {
            background-color: #333537;
            color: #fff;
        }

        /* Main Content */
        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            position: relative;
            width: 100%;
        }

        .chat-container {
            flex: 1;
            overflow-y: auto;
            scroll-behavior: smooth;
            padding-bottom: 50px;
        }

        .inner-container {
            width: 100%;
            max-width: 820px;
            margin: 0 auto;
            padding: 20px;
        }

        /* Welcome Screen */
        .welcome-header {
            margin-top: 80px;
        }

        .gradient-text {
            font-size: 56px;
            font-weight: 500;
            background: linear-gradient(74deg, #4285f4 0%, #9b72cb 25%, #d96570 50%, #4285f4 100%);
            background-size: 200% auto;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: shine 5s linear infinite;
        }

        @keyframes shine {
            to { background-position: 200% center; }
        }

        /* Message Bubbles */
        .msg-row {
            margin-bottom: 40px;
            display: flex;
            flex-direction: column;
            width: 100%;
            animation: fadeIn 0.4s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .user-wrapper {
            align-self: flex-end;
            max-width: 85%;
        }

        .user-bubble {
            background-color: #28292a;
            padding: 14px 24px;
            border-radius: 28px;
            font-size: 16px;
            line-height: 1.6;
            word-wrap: break-word;
            white-space: pre-wrap;
            color: #fff;
        }

        .ai-wrapper {
            align-self: flex-start;
            display: flex;
            gap: 16px;
            width: 100%;
        }

        .ai-avatar {
            width: 36px;
            height: 36px;
            background: linear-gradient(to bottom right, #4285f4, #d96570);
            border-radius: 50%;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .ai-avatar i { font-size: 18px; color: white; }

        .ai-text {
            flex: 1;
            font-size: 16px;
            line-height: 1.8;
            color: var(--text-main);
            word-wrap: break-word;
        }

        /* Input Bar */
        .bottom-bar {
            padding: 20px;
            background-color: var(--bg-main);
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .input-box {
            width: 100%;
            max-width: 820px;
            background-color: var(--bg-input);
            border-radius: 32px;
            padding: 14px 24px;
            display: flex;
            align-items: flex-end;
            gap: 16px;
            border: 2px solid transparent;
            transition: 0.3s;
        }

        .input-box:focus-within {
            background-color: #282a2c;
        }

        .input-box.dragover {
            border-color: var(--gemini-blue);
        }

        textarea {
            flex: 1;
            background: transparent;
            border: none;
            outline: none;
            color: var(--text-main);
            font-size: 16px;
            resize: none;
            max-height: 200px;
            padding: 4px 0;
            line-height: 1.5;
        }

        /* Utilities */
        .hidden { display: none !important; }
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-thumb { background: #333537; border-radius: 10px; }

        /* Code Block Styling */
        pre {
            background: #000;
            padding: 16px;
            border-radius: 12px;
            margin: 10px 0;
            overflow-x: auto;
            border: 1px solid #444;
        }
        code { font-family: 'Consolas', monospace; color: #a5d6ff; }
    </style>
</head>
<body ondragover="event.preventDefault(); document.getElementById('input-box').classList.add('dragover')" 
      ondragleave="document.getElementById('input-box').classList.remove('dragover')" 
      ondrop="handleFileDrop(event)">

    <aside class="sidebar">
        <button class="new-chat-btn" onclick="createNewChat()">
            <i class="fa-solid fa-plus"></i> <span>New chat</span>
        </button>
        
        <div class="px-4 mb-4">
            <p class="text-[11px] font-bold text-gray-500 uppercase tracking-widest">Recent Activity</p>
        </div>

        <div id="sidebar-history" class="history-section">
            </div>

        <div class="mt-auto p-4 border-t border-[#333537]">
            <button onclick="clearAllData()" class="text-xs text-gray-500 hover:text-red-400 flex items-center gap-2">
                <i class="fa-solid fa-trash-can"></i> Clear Memory
            </button>
        </div>
    </aside>

    <main class="main-content">
        <div class="chat-container" id="scroll-target">
            
            <div id="welcome-view" class="inner-container welcome-header">
                <h1 class="gradient-text">Hello, Gemini User</h1>
                <p class="text-3xl text-gray-500 font-medium mt-2">How can I help you today?</p>
                
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mt-12">
                    <div class="p-6 bg-[#1e1f20] rounded-2xl border border-transparent hover:border-[#444] cursor-pointer transition" onclick="quickPrompt('Help me write a professional email')">
                        <p class="text-sm">Help me write a professional email...</p>
                    </div>
                    <div class="p-6 bg-[#1e1f20] rounded-2xl border border-transparent hover:border-[#444] cursor-pointer transition" onclick="quickPrompt('Explain how quantum computing works')">
                        <p class="text-sm">Explain how quantum computing works...</p>
                    </div>
                </div>
            </div>

            <div id="chat-view" class="inner-container hidden pt-10">
                </div>
        </div>

        <div class="bottom-bar">
            <div class="input-box" id="input-box">
                <textarea id="main-prompt" rows="1" placeholder="Enter a prompt here" onkeydown="handleKeyDown(event)"></textarea>
                <div class="flex gap-4 items-center mb-1">
                    <label class="cursor-pointer text-gray-400 hover:text-white transition">
                        <i class="fa-regular fa-image text-xl"></i>
                        <input type="file" class="hidden" onchange="handleFileUpload(event)">
                    </label>
                    <i class="fa-solid fa-paper-plane text-blue-500 cursor-pointer text-xl hover:scale-110 transition" onclick="processChat()"></i>
                </div>
            </div>
            <p class="text-[11px] text-gray-500 mt-3 text-center">
                This AI is powered by a custom Context Engine. History is saved to your browser's LocalStorage.
            </p>
        </div>
    </main>

    <script>
        /* =========================================
           GEMINI ADVANCED LOGIC ENGINE (v3.0)
           =========================================
        */

        const welcomeView = document.getElementById('welcome-view');
        const chatView = document.getElementById('chat-view');
        const mainPrompt = document.getElementById('main-prompt');
        const sidebarHistory = document.getElementById('sidebar-history');
        const scrollTarget = document.getElementById('scroll-target');
        const inputBox = document.getElementById('input-box');

        let currentSessionId = null;
        let database = JSON.parse(localStorage.getItem('gemini_v3_db')) || {};

        // Safety & Smart Config
        const REFUSAL_MSG = "I cannot fulfill this request. I am designed to be a helpful and safe AI assistant, and my safety guidelines prevent me from generating content related to hacks, exploits, or unauthorized access.";
        const BANNED_TERMS = ["hack", "exploit", "leak", "cheat", "bank hack", "bypass"];

        // 1. Core Chat Functions
        function handleKeyDown(e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                processChat();
            }
            // Dynamic Height
            mainPrompt.style.height = 'auto';
            mainPrompt.style.height = (mainPrompt.scrollHeight) + 'px';
        }

        function processChat() {
            const rawText = mainPrompt.value.trim();
            if (!rawText) return;

            // Session Management
            if (!currentSessionId) {
                currentSessionId = "chat_" + Date.now();
                database[currentSessionId] = {
                    title: rawText.substring(0, 30) + (rawText.length > 30 ? "..." : ""),
                    timestamp: Date.now(),
                    messages: []
                };
                welcomeView.classList.add('hidden');
                chatView.classList.remove('hidden');
                renderSidebar();
            }

            // Append User Message
            appendMessage('user', rawText);
            database[currentSessionId].messages.push({ role: 'user', content: rawText });

            // AI "Thinking" Logic
            mainPrompt.value = '';
            mainPrompt.style.height = 'auto';

            setTimeout(() => {
                const response = generateIntelligentResponse(rawText, database[currentSessionId].messages);
                appendMessage('ai', response);
                database[currentSessionId].messages.push({ role: 'ai', content: response });
                saveToStorage();
            }, 700);
        }

        // 2. The Intelligence Engine (Context-Aware)
        function generateIntelligentResponse(input, history) {
            const prompt = input.toLowerCase();
            
            // Check Banned Content
            if (BANNED_TERMS.some(term => prompt.includes(term))) {
                return REFUSAL_MSG;
            }

            // Context: Check if user is asking about previous things
            const lastMessages = history.slice(-5); 
            
            // Logic: Code Requests
            if (prompt.includes("code") || prompt.includes("script") || prompt.includes("function")) {
                return `Based on your request, here is a logic structure you can use: \n\n<pre><code>-- Advanced Logic\nfunction handleRequest(data)\n    if data.valid then\n        print("Success")\n    end\nend</code></pre>\n\nDoes this help with what you're building?`;
            }

            // Logic: Personality/Identity
            if (prompt.includes("who are you") || prompt.includes("your name")) {
                return "I am a Gemini-inspired AI assistant. I'm designed to process complex information and help you brainstorm, write, and code.";
            }

            // Logic: Greetings
            if (prompt.includes("hello") || prompt.includes("hi ") || prompt.equals?.("hi")) {
                return "Hello! I'm here and ready to help. What's on your mind?";
            }

            // Default Smart Response
            return "I understand. Looking at our conversation so far, you're interested in " + prompt.split(' ').slice(0, 3).join(' ') + "... Let's dive deeper into that. Could you provide more specifics?";
        }

        // 3. UI Rendering
        function appendMessage(role, content) {
            const row = document.createElement('div');
            row.className = 'msg-row';

            if (role === 'user') {
                row.innerHTML = `<div class="user-wrapper"><div class="user-bubble">${escapeHtml(content)}</div></div>`;
            } else {
                row.innerHTML = `
                    <div class="ai-wrapper">
                        <div class="ai-avatar"><i class="fa-solid fa-sparkles"></i></div>
                        <div class="ai-text">${content}</div>
                    </div>`;
            }

            chatView.appendChild(row);
            autoScroll();
        }

        function renderSidebar() {
            sidebarHistory.innerHTML = '';
            const sortedSessions = Object.keys(database).sort((a, b) => database[b].timestamp - database[a].timestamp);
            
            sortedSessions.forEach(id => {
                const item = document.createElement('div');
                item.className = `history-item ${id === currentSessionId ? 'active' : ''}`;
                item.innerHTML = `<i class="fa-regular fa-message"></i> ${database[id].title}`;
                item.onclick = () => loadSession(id);
                sidebarHistory.appendChild(item);
            });
        }

        function loadSession(id) {
            currentSessionId = id;
            welcomeView.classList.add('hidden');
            chatView.classList.remove('hidden');
            chatView.innerHTML = '';
            
            database[id].messages.forEach(msg => {
                appendMessage(msg.role, msg.content);
            });
            renderSidebar();
        }

        function createNewChat() {
            currentSessionId = null;
            chatView.innerHTML = '';
            chatView.classList.add('hidden');
            welcomeView.classList.remove('hidden');
            mainPrompt.value = '';
            renderSidebar();
        }

        // 4. Persistence & File Logic
        function saveToStorage() {
            localStorage.setItem('gemini_v3_db', JSON.stringify(database));
        }

        function clearAllData() {
            if (confirm("Delete all chat history permanently?")) {
                localStorage.removeItem('gemini_v3_db');
                database = {};
                createNewChat();
                renderSidebar();
            }
        }

        function handleFileUpload(e) {
            const file = e.target.files[0];
            if (file) {
                mainPrompt.value += `[File: ${file.name}] `;
                mainPrompt.focus();
            }
        }

        function handleFileDrop(e) {
            e.preventDefault();
            inputBox.classList.remove('dragover');
            const file = e.dataTransfer.files[0];
            if (file) {
                mainPrompt.value += `[Dropped: ${file.name}] `;
                mainPrompt.focus();
            }
        }

        // 5. Helpers
        function autoScroll() {
            scrollTarget.scrollTop = scrollTarget.scrollHeight;
        }

        function quickPrompt(txt) {
            mainPrompt.value = txt;
            processChat();
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // Initial Boot
        renderSidebar();
    </script>
</body>
</html>
