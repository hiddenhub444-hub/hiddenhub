<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Limited Ext Generator</title>
    <style>
        :root {
            --primary: #58a6ff;
            --bg: #0d1117;
            --card-bg: #161b22;
            --border: #30363d;
            --success: #238636;
        }

        body {
            font-family: 'Segoe UI', Tahoma, sans-serif;
            background-color: var(--bg);
            color: #c9d1d9;
            margin: 0;
            display: flex;
        }

        .sidebar {
            width: 280px;
            background: var(--card-bg);
            height: 100vh;
            padding: 25px;
            border-right: 1px solid var(--border);
            position: fixed;
            box-sizing: border-box;
            overflow-y: auto;
        }

        .sidebar h3 { font-size: 11px; color: var(--primary); margin-top: 0; margin-bottom: 20px; text-transform: uppercase; letter-spacing: 2px; }

        .setting-group { margin-bottom: 22px; padding-bottom: 12px; border-bottom: 1px solid #21262d; }
        
        .sidebar label { font-weight: bold; font-size: 10px; display: block; margin-bottom: 8px; color: #8b949e; }

        .sidebar input[type="number"] {
            width: 100%;
            background: var(--bg);
            border: 1px solid var(--border);
            color: white;
            padding: 8px;
            border-radius: 5px;
        }

        .switch-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        .switch {
            position: relative;
            display: inline-block;
            width: 36px;
            height: 20px;
        }

        .switch input { opacity: 0; width: 0; height: 0; }

        .slider {
            position: absolute;
            cursor: pointer;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: #30363d;
            transition: .4s;
            border-radius: 20px;
        }

        .slider:before {
            position: absolute;
            content: "";
            height: 14px; width: 14px;
            left: 3px; bottom: 3px;
            background-color: white;
            transition: .4s;
            border-radius: 50%;
        }

        input:checked + .slider { background-color: var(--success); }
        input:checked + .slider:before { transform: translateX(16px); }

        .main-content {
            margin-left: 280px;
            padding: 40px;
            width: 100%;
            box-sizing: border-box;
        }

        textarea {
            width: 100%;
            background: var(--bg);
            color: #7ee787;
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 15px;
            font-family: 'Courier New', monospace;
            margin-bottom: 20px;
        }

        .input-area { height: 300px; }

        .gen-btn {
            width: 100%;
            background-color: var(--success);
            color: white;
            border: none;
            padding: 18px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            font-size: 16px;
            transition: 0.2s;
        }

        .gen-btn:hover { filter: brightness(1.2); }

        .outputs-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 25px;
            margin-top: 40px;
        }

        .output-card {
            background: var(--card-bg);
            padding: 20px;
            border-radius: 10px;
            border: 1px solid var(--border);
        }

        .output-area { height: 200px; font-size: 11px; color: #c9d1d9; background: #0d1117; }

        .copy-btn {
            width: 100%;
            background: #21262d;
            color: #c9d1d9;
            border: 1px solid var(--border);
            padding: 10px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
        }

        .copy-btn.success { background: var(--success); color: white; }
    </style>
</head>
<body>

<div class="sidebar">
    <h3>GENERATOR CONFIG</h3>
    
    <div class="setting-group">
        <label>TOTAL FILES:</label>
        <input type="number" id="fileCount" value="5" min="1" max="50">
    </div>

    <div class="setting-group">
        <label>ANIMATION:</label>
        <div class="switch-container">
            <span style="font-size: 11px;">Intro Sequence</span>
            <label class="switch">
                <input type="checkbox" id="animToggle" checked>
                <span class="slider"></span>
            </label>
        </div>
    </div>

    <div class="setting-group">
        <label>PRINTS:</label>
        <div class="switch-container">
            <span style="font-size: 11px;">Enabled</span>
            <label class="switch">
                <input type="checkbox" id="printToggle" checked>
                <span class="slider"></span>
            </label>
        </div>
        <label>PRINT LOOP:</label>
        <input type="number" id="printAmount" value="5" min="1" max="100">
    </div>

    <div class="setting-group">
        <label>FONT RANDOMISER:</label>
        <div class="switch-container">
            <span style="font-size: 11px;">Unique Per Line</span>
            <label class="switch">
                <input type="checkbox" id="fontToggle" checked>
                <span class="slider"></span>
            </label>
        </div>
    </div>
</div>

<div class="main-content">
    <h1 style="margin-top: 0;">Limited Ext Generator <span style="font-size: 14px; color: var(--primary);">1M+ Varied Combinations</span></h1>
    <textarea id="scriptInput" class="input-area" placeholder="Paste your Roblox Lua source here..."></textarea>
    
    <button class="gen-btn" onclick="generateOutputs()">GENERATE UNIQUE SCRIPTS</button>

    <div id="outputsWrapper" class="outputs-grid"></div>
</div>

<script>
    const pre = ["Vortex", "Nova", "Shadow", "Aether", "Zenith", "Titanium", "Phantom", "Arctic", "Elysium", "Void", "Cyber", "Frost", "Quantum", "Elite", "Prime", "Synapse", "Omega", "Hyper", "Solar", "Luna", "Project", "Secret", "Onyx", "Venom", "Acid"];
    const mid = ["X", "Infinite", "Ultra", "Alpha", "Final", "Core", "Shift", "Power", "Delta", "Logic", "Sense", "Strike", "Flow", "Wave", "Soul", "Dark", "Light", "Neon", "Global", "Next", "Pro"];
    const suf = ["Hub", "Ware", "V2", "V4", "X", "Script", "Edition", "Remastered", "Lite", "Premium", "External", "Internal", "Suite", "Tools", "Client", "Exploit"];

    const robloxFonts = ["Enum.Font.GothamBold", "Enum.Font.GothamMedium", "Enum.Font.Arcade", "Enum.Font.Fantasy", "Enum.Font.SciFi", "Enum.Font.Code", "Enum.Font.Highway", "Enum.Font.Bangers", "Enum.Font.Creepster", "Enum.Font.LuckiestGuy"];

    function generateMassiveName() {
        const p = pre[Math.floor(Math.random() * pre.length)];
        const m = mid[Math.floor(Math.random() * mid.length)];
        const s = suf[Math.floor(Math.random() * suf.length)];
        const num = Math.floor(Math.random() * 999);
        return `${p}-${m}-${s} ${num}`;
    }

    function processCode(source) {
        let lines = source.split('\n');
        const usePrint = document.getElementById('printToggle').checked;
        const printCount = document.getElementById('printAmount').value;
        const useFont = document.getElementById('fontToggle').checked;
        const useAnim = document.getElementById('animToggle').checked;

        let processedLines = lines.map(line => {
            let newLine = line;

            // 1. Color Randomizer
            newLine = newLine.replace(/Color3\.fromRGB\(\d+,\s*\d+,\s*\d+\)/g, () => {
                return `Color3.fromRGB(${Math.floor(Math.random()*255)}, ${Math.floor(Math.random()*255)}, ${Math.floor(Math.random()*255)})`;
            });

            // 2. PROTECTIVE TEXT RANDOMIZER
            // It only renames if "Title", "Logo", or "Header" is in the variable name.
            // It strictly IGNORES anything with Button, Click, Btn, or Toggle.
            const forbidden = /button|btn|click|toggle|mouse|keybind/i.test(newLine);
            const targets = /title|logo|header|name|maintext/i.test(newLine);

            if (newLine.includes(".Text") && targets && !forbidden) {
                newLine = newLine.replace(/"([^"]+)"/, `"${generateMassiveName()}"`);
            }

            // 3. Font Randomizer - Every font line gets a new roll
            if (useFont && newLine.includes(".Font")) {
                newLine = newLine.replace(/Enum\.Font\.[a-zA-Z]+/g, () => {
                    return robloxFonts[Math.floor(Math.random() * robloxFonts.length)];
                });
            }

            return newLine;
        });

        let finalCode = processedLines.join('\n');

        if (useAnim) {
            finalCode = `-- [GUI ANIMATION ENGINE LOADED]\ntask.spawn(function() \n    print("Initialising UI...") \n    task.wait(0.5)\nend)\n` + finalCode;
        }

        if (usePrint) {
            finalCode = `for i = 1, ${printCount} do print("LEAKED BY FPSL https://discord.gg/VuHrBW5q") end\n` + finalCode;
        }

        return finalCode;
    }

    function generateOutputs() {
        const source = document.getElementById('scriptInput').value;
        const count = document.getElementById('fileCount').value;
        const wrapper = document.getElementById('outputsWrapper');
        if (!source.trim()) return alert("No source detected!");

        wrapper.innerHTML = "";
        for (let i = 1; i <= count; i++) {
            const id = `out_${i}`;
            const card = document.createElement('div');
            card.className = 'output-card';
            card.innerHTML = `
                <label style="color:var(--primary)">UNIQUE BUILD #${i}</label>
                <textarea id="${id}" class="output-area" readonly>${processCode(source)}</textarea>
                <button class="copy-btn" onclick="copyText('${id}', this)">Copy Code</button>
            `;
            wrapper.appendChild(card);
        }
    }

    function copyText(id, btn) {
        const area = document.getElementById(id);
        area.select();
        document.execCommand('copy');
        btn.innerText = "COPIED TO CLIPBOARD!";
        btn.classList.add('success');
        setTimeout(() => { btn.innerText = "Copy Code"; btn.classList.remove('success'); }, 1500);
    }
</script>

</body>
</html>
