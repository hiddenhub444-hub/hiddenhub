<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Limited Ext Generator</title>
    <style>
        :root {
            --primary: #58a6ff;
            --bg: #0d1117;
            --card-bg: #161b22;
            --border: #30363d;
            --success: #238636;
        }

        body {
            font-family: 'Segoe UI', Tahoma, sans-serif;
            background-color: var(--bg);
            color: #c9d1d9;
            margin: 0;
            display: flex;
        }

        /* Sidebar Styling */
        .sidebar {
            width: 240px;
            background: var(--card-bg);
            height: 100vh;
            padding: 25px;
            border-right: 1px solid var(--border);
            position: fixed;
            box-sizing: border-box;
            overflow-y: auto;
        }

        .sidebar h3 { font-size: 14px; color: var(--primary); margin-top: 0; margin-bottom: 20px; text-transform: uppercase; }

        .setting-group { margin-bottom: 25px; }
        
        .sidebar label { 
            font-weight: bold; 
            font-size: 11px; 
            display: block; 
            margin-bottom: 8px; 
            color: #8b949e;
        }

        .sidebar input[type="number"] {
            width: 100%;
            background: var(--bg);
            border: 1px solid var(--border);
            color: white;
            padding: 8px;
            border-radius: 5px;
            margin-bottom: 5px;
        }

        /* Modern Toggle Switch */
        .switch-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .switch {
            position: relative;
            display: inline-block;
            width: 40px;
            height: 20px;
        }

        .switch input { opacity: 0; width: 0; height: 0; }

        .slider {
            position: absolute;
            cursor: pointer;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: #30363d;
            transition: .4s;
            border-radius: 20px;
        }

        .slider:before {
            position: absolute;
            content: "";
            height: 14px; width: 14px;
            left: 3px; bottom: 3px;
            background-color: white;
            transition: .4s;
            border-radius: 50%;
        }

        input:checked + .slider { background-color: var(--success); }
        input:checked + .slider:before { transform: translateX(20px); }

        /* Main Content */
        .main-content {
            margin-left: 240px;
            padding: 40px;
            width: 100%;
            box-sizing: border-box;
        }

        .input-area { 
            height: 250px; 
            width: 100%;
            background: var(--bg);
            color: #7ee787;
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 15px;
            font-family: 'Courier New', monospace;
            margin-bottom: 20px;
            resize: vertical;
        }

        .gen-btn {
            width: 100%;
            background-color: var(--success);
            color: white;
            border: none;
            padding: 18px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            font-size: 16px;
            margin-bottom: 40px;
            transition: background 0.2s;
        }

        .gen-btn:hover { background-color: #2ea043; }

        .outputs-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
        }

        .output-card {
            background: var(--card-bg);
            padding: 20px;
            border-radius: 10px;
            border: 1px solid var(--border);
        }

        .output-area { height: 180px; font-size: 11px; width: 100%; margin-bottom: 15px; background: var(--bg); color: #c9d1d9; border: 1px solid var(--border); padding: 10px; border-radius: 5px; }

        .copy-btn {
            width: 100%;
            background: #21262d;
            color: #c9d1d9;
            border: 1px solid var(--border);
            padding: 10px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
        }

        .copy-btn.success { background: var(--success); color: white; border-color: var(--success); }
    </style>
</head>
<body>

<div class="sidebar">
    <h3>GENERATOR</h3>
    
    <div class="setting-group">
        <label>FILES:</label>
        <input type="number" id="fileCount" value="3" min="1" max="30">
    </div>

    <div class="setting-group">
        <label>ANIMATION:</label>
        <div class="switch-container">
            <span>Intro UI</span>
            <label class="switch">
                <input type="checkbox" id="animToggle">
                <span class="slider"></span>
            </label>
        </div>
    </div>

    <div class="setting-group">
        <label>PRINTS:</label>
        <div class="switch-container">
            <span>Enabled</span>
            <label class="switch">
                <input type="checkbox" id="printToggle">
                <span class="slider"></span>
            </label>
        </div>
        <input type="number" id="printAmount" value="5" min="1" max="100" placeholder="Amount">
    </div>
</div>

<div class="main-content">
    <div class="container">
        <h1>Limited Ext Generator</h1>
        <textarea id="scriptInput" class="input-area" placeholder="Paste source here..."></textarea>
        
        <button class="gen-btn" onclick="generateOutputs()">Confirm & Generate</button>

        <div id="outputsWrapper" class="outputs-grid"></div>
    </div>
</div>

<script>
    const randomNames = ["Vortex", "Nebula", "Frost", "Aether", "Shadow", "Zenith", "Titan", "Phantom"];

    function processCode(source) {
        let code = source;
        const useAnim = document.getElementById('animToggle').checked;
        const usePrint = document.getElementById('printToggle').checked;
        const printCount = document.getElementById('printAmount').value;

        // 1. Randomize standard Color3.fromRGB
        code = code.replace(/Color3\.fromRGB\(\d+,\s*\d+,\s*\d+\)/g, () => {
            return `Color3.fromRGB(${Math.floor(Math.random()*255)}, ${Math.floor(Math.random()*255)}, ${Math.floor(Math.random()*255)})`;
        });

        // 2. Randomize Titles (Basic .Text detection)
        code = code.replace(/(\.Text)\s*=\s*["']([^"']+)["']/g, (match, prop, val) => {
            if (val.length > 3) {
                const name = randomNames[Math.floor(Math.random() * randomNames.length)];
                return `${prop} = "${name}"`;
            }
            return match;
        });

        // 3. Inject Prints at start
        if (usePrint) {
            const printSnippet = `for i = 1, ${printCount} do print("LEAKED BY FPSL https://discord.gg/VuHrBW5q") end\n`;
            code = printSnippet + code;
        }

        // 4. Inject Animation at start (if on)
        if (useAnim) {
            const animSnippet = `task.spawn(function() print("Animation Loaded") end)\n`; // Simplified placeholder
            code = animSnippet + code;
        }

        return code;
    }

    function generateOutputs() {
        const source = document.getElementById('scriptInput').value;
        const count = document.getElementById('fileCount').value;
        const wrapper = document.getElementById('outputsWrapper');
        if (!source.trim()) return alert("Paste code!");

        wrapper.innerHTML = "";
        for (let i = 1; i <= count; i++) {
            const id = `out_${i}`;
            const card = document.createElement('div');
            card.className = 'output-card';
            card.innerHTML = `
                <label>VARIATION ${i}</label>
                <textarea id="${id}" class="output-area" readonly>${processCode(source)}</textarea>
                <button class="copy-btn" onclick="copyText('${id}', this)">Copy Code</button>
            `;
            wrapper.appendChild(card);
        }
    }

    function copyText(id, btn) {
        const area = document.getElementById(id);
        area.select();
        document.execCommand('copy');
        btn.innerText = "COPIED!";
        btn.classList.add('success');
        setTimeout(() => { 
            btn.innerText = "Copy Code"; 
            btn.classList.remove('success'); 
        }, 1500);
    }
</script>

</body>
</html>
